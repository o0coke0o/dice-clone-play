<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>주사위 방어전</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#11150f;overflow:hidden;
            -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;}
  #cv{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';

/* ============================================================================
   주사위 방어전 — 단일 파일 프로토타입
   그림은 전부 캔버스로 직접 그린다. 외부 이미지/사운드/폰트 없음.

   수치 표기 규칙
     [관찰] 실제 플레이 화면에서 확인한 값
     [임시] 관찰값 없음. 임의로 정한 값이므로 나중에 교체할 것
   모든 수치는 아래 CFG 한 곳에만 둔다.
   ========================================================================== */

const CFG = {

  // ver3: XP 곡선을 바꿨다. 옛 세이브의 쌓인 경험치가 새 기준을 이미 넘어
  //       첫 처치에 바로 레벨업이 터지는 문제가 있어 런을 폐기한다
  save: { key:'dice-clone.save', ver:3 },

  /* 밸런스 확인용 스위치.
     freshOnLoad: true 면 새로고침할 때마다 저장된 런을 무시하고 판 1부터 시작한다.
                  재화는 그대로 쌓인다. 정상 플레이로 돌리려면 false. */
  dev: { freshOnLoad:true },

  view: { w:360, arMin:1.40, arMax:2.30 },      // [임시] 논리 해상도. 가로 360 고정, 세로는 화면 비율

  /* ---- 무기 ------------------------------------------------------------
     피해와 레벨당 증가폭은 영웅 상세 화면 관찰값.
     cost 는 관찰만 해둔 값이며 이번 단계에서 사용하지 않는다(무기 레벨업 미구현). */
  weapons: {
    // cur = 레벨업에 쓰는 재화, cost = Lv1→2 비용, costStep = 레벨당 증가분
    // [관찰] 빠름 피해5 Lv1 → 7 Lv2, 레벨당 +2, 비용 결정 20 → 25 (그래서 step 5)
    // [관찰] 강함 피해8 Lv1, 레벨당 +4, 비용 결정 35. step 은 [임시]
    // ── 2026-08-18 (David 지시): 재화 역할을 둘로 못 박는다 ──
    //   단검  = 캐릭터 공격력(무기 레벨). 마법사·궁수 가리지 않고 전부 이걸 쓴다.
    //   다이아 = 주사위 등급(아래 diceTiers). 오직 그것만.
    //   전에는 마법사가 다이아, 궁수가 단검이라 영웅마다 모으는 재화가 달랐다.
    fast:   { name:'빠름', dmg:5, dmgPerLv:2, col:'#7fe0ff', col2:'#1b86d8', cur:'dagger', cost:20, costStep:5  },
    strong: { name:'강함', dmg:8, dmgPerLv:4, col:'#ffb03a', col2:'#e8452a', cur:'dagger', cost:35, costStep:10 },
    // 궁수 무기 — 원본 관찰값이 없다. 전부 [임시].
    // 유도는 마법사의 특성이므로 궁수 화살은 직선으로 날아간다(missile.homing=false).
    // 대신 이동 예측 조준을 하고 아주 빠르게 날아간다.
    // 궁수 강화는 단검으로 한다 [관찰] — 영웅 목록에서 ARCHER 옆이 단검 아이콘이었다
    swift: { name:'속사', dmg:4, dmgPerLv:2, col:'#c6f06a', col2:'#4e7d1c', cur:'dagger', cost:15, costStep:5 }, // [임시]
    ice:   { name:'얼음', dmg:6, dmgPerLv:2, col:'#bdefff', col2:'#2b8fc9', cur:'dagger', cost:25, costStep:8 }, // [임시]
    /* 세 번째 무기 — 영웅 상세의 '특별함' 칸이 이것이다.
       주문서에서 카드를 얻어야 열리고, 열리면 주사위 마지막 면이 이 무기가 된다(heroStartFaces). */
    pierce:{ name:'관통', dmg:5, dmgPerLv:2, col:'#eaff9a', col2:'#7a9c15', cur:'dagger', cost:30, costStep:10 }, // [임시]
    bolt:  { name:'전기', dmg:6, dmgPerLv:3, col:'#c7b6ff', col2:'#5b3fd6', cur:'dagger', cost:30, costStep:10 }, // [임시]
    /* 뱀 — David 지정으로 투사체가 전부 초록이다. poison:true 인 무기에 맞으면 독이 오른다 */
    venom: { name:'독침', dmg:4, dmgPerLv:2, col:'#9bf06a', col2:'#2f7a24', cur:'dagger', cost:15, costStep:5,  poison:true }, // [임시]
    acid:  { name:'산성', dmg:7, dmgPerLv:3, col:'#c9ff8a', col2:'#4a8f1e', cur:'dagger', cost:25, costStep:8,  poison:true }, // [임시]
  },

  /* 전투력 = 6면 총피해 × 계수.
     [관찰] 총피해 54 → 453, 66 → 554. 453/54=8.389, 554/66=8.394 → 계수 8.39 */
  power: { coef:8.39 },

  /* 영웅 목록의 '잠금 해제 예정' 칸 [관찰] — 사진에 있던 조건들 */
  lockedHeroes: [
    '전투 8에서 해제', '전투 15에서 해제', '상점에서',
    '전투 43에서 해제', '상점에서', '전투 29에서 해제',
    '도전 과제로 해제', '상점에서', '상점에서',
  ],

  /* 얼음 화살에 맞은 적은 잠깐 느려진다 [임시] */
  ice: { slowMul:0.45, slowT:1.6 },

  /* 조준 — 화면 위(사거리 밖)에 있는 적은 쏘지 않고 기다린다 */
  aim: { minY:4 },

  /* ---- 주사위 공통 ------------------------------------------------------
     면에 적힌 숫자 c 는 발사 수이지 피해량이 아니다. */
  dice: {
    minInterval: 0.35,        // [임시] 속도 증가 누적 하한
    spin:        1.20,        // 주사위가 튀어올라 굴러 착지할 때까지. 착지하는 순간 발사한다
    spinMaxFrac: 0.70,        // 다만 굴림 주기의 이 비율을 넘지 않는다 —
                              // 속도 카드로 주기가 짧아졌을 때 연출이 다음 굴림을 잡아먹지 않게
    shotGap:     0.08,        // [임시] 한 면 안에서의 연사 간격
    startTwos:   2,           // 시작 6면 중 무작위 이 개수만큼 '기본값+1'로 시작한다(나머지는 기본값)
  },

  /* ---- 주사위 등급 -------------------------------------------------------
     2026-08-18 (David 지시): 주사위를 영구 강화한다.
       "실버 골드 플래티넘 에메랄드 다이아몬드 … 위로 올라갈수록 시작부터 눈금이 더 높게"
     base = 그 등급으로 판을 시작할 때 여섯 면에 적히는 발사 수.
       지금까지는 어느 등급이든 1이었다(=실버). 등급이 오르면 시작 눈금 자체가 올라간다.
     강화는 영웅 상세(캐릭터 강화창)에서 '다이아'로만 한다. 영웅마다 따로 올린다 —
       주사위는 영웅의 것이고, 무기 레벨도 이미 영웅별이라 결이 같다.
     cost 는 그 등급으로 '올라가는' 값이다(실버는 시작 등급이라 0).
     ⚠ 등급을 더 넣을 때는 이 배열에만 줄을 더한다. 아래 코드는 길이를 세지 않는다. */
  /* look = 주사위를 그리는 방식. 등급이 오를수록 눈에 띄게 화려해진다(David 지시).
       sheen  윗면 광택의 진하기
       rim    면 테두리 색 — 등급 색을 그대로 쓴다
       rimW   테두리 굵기
       facet  보석 컷 수. 0 = 민짜, 1 = 한 겹, 2 = 두 겹, 3 = 프리즘 줄까지
       glow   주사위 뒤에서 번지는 빛의 세기(0 = 없음)
       glowRGB  그 빛의 색. rgba() 로 쓰려고 숫자만 적는다
       spark  주위를 도는 반짝임 개수
     ⚠ 등급을 더 넣을 때는 look 도 같이 적을 것. 빠지면 실버 모양으로 그려진다. */
  diceTiers: [
    /* 2026-08-19 (David 지시) 개편 두 가지:
         ① 브론즈를 맨 아래에 넣는다. 시작 등급이 '실버'라 회색이었고 금속처럼 안 보였다.
         ② 등급은 이제 시작 눈금을 올리지 않는다. 눈금은 코인으로 면마다 따로 올린다(CFG.faceUp).
            등급이 정하는 것은 '동시에 켤 수 있는 스킬 수'다 — 스킬을 더 쓰고 싶으면
            더 높은 등급이 갖고 싶어지게.
       skills = 그 등급에서 켤 수 있는 스킬 개수(영웅마다 따로 센다).
       col/col2/hi = 금속 띠를 만드는 세 색. hi 가 반사되는 밝은 띠다 —
         두 색만 쓰면 플라스틱처럼 보인다. */
    { key:'bronze',   name:'브론즈',     skills:1, cost:0,    col:'#e2985c', col2:'#7d4519', hi:'#ffdcb0',
      look:{ sheen:0.20, rim:'rgba(255,214,168,0.55)', rimW:1,   facet:0, glow:0,    glowRGB:'226,152,92',  spark:0 } },
    { key:'silver',   name:'실버',       skills:2, cost:40,   col:'#dde5ec', col2:'#79879a', hi:'#ffffff',
      look:{ sheen:0.30, rim:'rgba(255,255,255,0.70)', rimW:1.3, facet:0, glow:0.12, glowRGB:'214,226,238', spark:0 } },
    { key:'gold',     name:'골드',       skills:3, cost:110,  col:'#ffd75e', col2:'#a3701a', hi:'#fff8d6',
      look:{ sheen:0.40, rim:'rgba(255,236,170,0.90)', rimW:1.7, facet:1, glow:0.24, glowRGB:'255,215,94',  spark:1 } },
    { key:'platinum', name:'플래티넘',   skills:4, cost:260,  col:'#eef4f9', col2:'#7f92a5', hi:'#ffffff',
      look:{ sheen:0.50, rim:'rgba(255,255,255,0.98)', rimW:2,   facet:2, glow:0.34, glowRGB:'232,241,248', spark:2 } },
    { key:'emerald',  name:'에메랄드',   skills:5, cost:600,  col:'#63e6a4', col2:'#136b44', hi:'#d6ffec',
      look:{ sheen:0.56, rim:'rgba(184,255,224,0.98)', rimW:2.2, facet:3, glow:0.48, glowRGB:'99,230,164',  spark:3 } },
    { key:'diamond',  name:'다이아몬드', skills:6, cost:1200, col:'#8fe9ff', col2:'#1f7fb4', hi:'#f4ffff',
      look:{ sheen:0.64, rim:'rgba(240,255,255,1)',    rimW:2.5, facet:3, glow:0.66, glowRGB:'143,233,255', spark:5 } },
  ],

  /* 시작 눈금 — 면마다 따로 올린다(2026-08-19 David 지시). 재화는 코인(gold).
     일괄이 아니라 여섯 면을 각각 1씩 올린다. cost 는 그 면의 다음 한 칸 값이고
     올릴수록 step 만큼 비싸진다. max 는 면 하나가 올라갈 수 있는 최대 칸수. */
  faceUp: { cur:'gold', cost:12, step:8, max:4 },


  /* ---- 주사위 정육면체 --------------------------------------------------
     둥근 모서리 정육면체가 슬롯에서 튀어올라 굴러 착지한다.
     아래 값은 David가 준 참고 화면 3장에서 실측했다(가로 360 논리 기준).
       쉴 때 한 변 약 57 → 슬롯 크기와 비슷
       공중에서 약 116 → 약 2배로 커진다
       올라가는 높이 약 76 → 최고점에서 성벽 높이에 닿는다 */
  cube: {
    side:52, jump:76, grow:1.0,   // [관찰-실측] grow 1.0 = 최고점에서 2배
    round:0.22,                   // [임시] 모서리 둥글기(한 변 대비)
    // 착지 자세의 기울기. 0 이면 나온 면이 정면으로 딱 보인다(원본이 그렇다).
    // 0 이 아니면 옆면까지 같이 보여 삐딱하게 착지한 것처럼 된다.
    // 구르는 동안에는 어차피 회전하므로 입체로 보인다
    tiltX:0, tiltY:0,
    turnMin:1, turnMax:2,         // [임시] 굴러가며 도는 바퀴 수
    kickPx:5,                     // [임시] 한 발 쏠 때 눌리는 픽셀
  },

  /* ---- 영웅 ------------------------------------------------------------
     영웅마다 자기 주사위 6면과 자기 경험치/레벨을 따로 갖는다.
     마법사 면 구성은 관찰값(빠름 3면 각 2발, 강함 3면 각 1발).
     궁수는 원본 관찰값이 없다 — 배치 카드도 전용 주사위도 David 요청으로 만든 것이라 전부 [임시]. */
  heroes: {
    mage: {
      name:'마법사',
      // David 요청으로 시작은 전부 1발. 관찰된 원본 상태는 빠름 3면 각 2발 / 강함 3면 각 1발이며
      // 그건 무기를 키운 뒤의 모습이다. 되돌리려면 fast 세 면을 c:2 로.
      baseFaces:[ { w:'fast',   c:1 }, { w:'fast',   c:1 }, { w:'fast',   c:1 },
                  { w:'strong', c:1 }, { w:'strong', c:1 }, { w:'strong', c:1 } ],
      interval:2.60,          // [임시] 굴림 주기(초). 느리게 시작해야 '속도 증가' 카드가 의미를 갖는다
      tile:'#4db8f0', tile2:'#1a7fd4',   // [관찰] 원본 주사위는 파랑
      card:'#2f7ff0', cardTop:'#5aa8ff', // 레벨업 카드 색 — 어느 영웅의 레벨업인지 색으로 구분
      xp:'#7fd4ff',                      // 이 영웅의 경험치 막대 색
    },
    archer: {
      name:'궁수',
      // 마법사와 같은 이유로 궁수도 전부 1발로 시작한다.
      // (배치되자마자 마법사보다 강하면 '약하게 시작해 키운다'는 흐름이 깨진다)
      baseFaces:[ { w:'swift', c:1 }, { w:'swift', c:1 }, { w:'swift', c:1 },
                  { w:'ice',   c:1 }, { w:'ice',   c:1 }, { w:'ice',   c:1 } ], // [임시]
      interval:2.20,          // [임시] 마법사보다 자주 굴리고 발당 피해는 낮다
      tile:'#57b86a', tile2:'#237a45',   // [임시] 마법사 주사위와 구분하려고 초록으로
      card:'#2f9e4f', cardTop:'#5fc97c', // [임시] 궁수 레벨업 카드는 초록
      xp:'#9ff06a',
    },
    /* 뱀 — 2026-08-19 David 지시. 영웅 하나가 레벨 10 에 닿으면 열린다.
       특징은 독이다. 맞으면 바로 큰 피해가 아니라 시간을 두고 깎인다 —
       그래서 기본 피해는 낮게 잡고, 독 카드를 얻을수록 세지는 결로 만들었다. */
    snake: {
      name:'뱀',
      baseFaces:[ { w:'venom', c:1 }, { w:'venom', c:1 }, { w:'venom', c:1 },
                  { w:'acid',  c:1 }, { w:'acid',  c:1 }, { w:'acid',  c:1 } ], // [임시]
      interval:2.00,          // [임시] 셋 중 가장 자주 굴린다. 대신 발당 피해가 가장 낮다
      tile:'#79d94f', tile2:'#2c6b1c',   // [임시]
      card:'#3f9e2f', cardTop:'#7ad35c', // [임시]
      xp:'#b6f06a',
    },
  },
  /* 세 번째 무기(영웅 상세의 '특별함' 칸). 주문서 카드로 열린다.
     뱀은 아직 없다 — 없으면 그 칸이 잠긴 채로 남는다(specialOn 이 false 를 준다) */
  heroSpecial:{ mage:'bolt', archer:'pierce' },
  /* 뱀은 처음부터 있지 않다. 영웅 하나가 이 레벨에 닿으면 열린다(David 지시) */
  snakeAt: 10,
  heroOrder:['mage','archer','snake'],
  /* 합류 순서 → 하단 슬롯 번호. [가운데, 오른쪽, 왼쪽] 순으로 채운다 (David 지시).
     슬롯은 왼쪽부터 0·1·2 이므로 1(가운데) → 2(오른쪽) → 0(왼쪽)이 된다. */
  slotOrder:[1, 2, 0],

  /* ---- 스킬 카드 (주문서 탭) ---------------------------------------------
     주문서 탭에 4x4 = 16칸이 있고, 판을 하나 끝낼 때마다 카드팩 3택으로 한 장씩 모은다.
     칸 수는 16 고정, 내용은 차차 채운다.
       soon:true  아직 만들지 않은 칸. 탭에서는 물음표로 보이고 카드팩에도 나오지 않는다
       hero       그 영웅의 스킬(카드 색이 영웅 색을 따라간다). null 이면 공용
       kind       'skill' 전투 효과 / 'perk' 캐릭터 특혜 — perk 는 아직 하나도 없다
     effect 는 '무엇이 얼마나 세지는가' 한 줄이다. 지금 쓰는 형식은 하나뿐:

const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const rnd  = (a,b) => a + Math.random() * (b - a);
const rndi = (a,b) => Math.floor(a + Math.random() * (b - a + 1));
function pickOne(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function angLerp(a,b,t){
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const S = { s:1, ox:0, oy:0, dpr:1 };
const L = {};
let VW = CFG.view.w, VH = 720;

function resize(){
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  S.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  VW = CFG.view.w;
  VH = Math.round(VW * clamp(h / w, CFG.view.arMin, CFG.view.arMax));
  cv.width  = Math.round(w * S.dpr);
  cv.height = Math.round(h * S.dpr);
  S.s  = Math.min(cv.width / VW, cv.height / VH);
  S.ox = (cv.width  - VW * S.s) / 2;
  S.oy = (cv.height - VH * S.s) / 2;
  layout();
}

function layout(){
  L.w = VW; L.h = VH;
  // 경험치 막대는 상단이 아니라 각 영웅 슬롯 아래에 둔다(영웅이 늘어나도 자리가 늘지 않는다)
  L.waveY = 30;
  L.hud = L.waveY + 30;
  L.wallY = Math.round(VH * 0.735);                     // [관찰] 성벽 위치 비율
  L.wallY = Math.max(L.hud + 150, L.wallY);
  L.groundH = VH - L.wallY;
  // 하단 슬롯 3칸. 자리는 영웅이 아니라 '합류한 순서'로 정해진다 (2026-08-19 David 지시):
  //   처음 고른 영웅 → 가운데 / 나중에 합류 → 오른쪽 / 그다음 → 왼쪽
  // 전에는 마법사=가운데·궁수=오른쪽으로 박혀 있어서 궁수로 시작하면 오른쪽에서 시작했다.
  L.cardW = 56; L.cardH = 54;
  L.slotX = [0.20, 0.50, 0.80].map(f => Math.round(L.w * f - L.cardW / 2));
  L.cardX = {};
  const ord = (G.run && G.run.order) ? G.run.order : [];
  for (let i = 0; i < CFG.heroOrder.length; i++){
    const hid = CFG.heroOrder[i], k = ord.indexOf(hid);
    // 아직 안 나온 영웅도 자리는 있어야 한다(합류하는 순간 그려지므로) — 순서 뒤에 세운다
    L.cardX[hid] = L.slotX[CFG.slotOrder[(k >= 0 ? k : ord.length + i) % CFG.slotOrder.length]];
  }
  // 슬롯 아래로 굴림 막대 → 경험치 막대 → Lv 글자 순서. 전체가 바닥에 닿지 않게 위로 올린다
  L.barH = 8; L.lvH = 12;
  const stackH = L.cardH + 6 + L.barH + 3 + L.barH + L.lvH;
  L.cardY = Math.min(Math.round(L.wallY + L.groundH * 0.21), VH - 6 - stackH);
  L.pillY = L.cardY + L.cardH + 6;
  L.xpBarY = L.pillY + L.barH + 3;
  L.lvY = L.xpBarY + L.barH + 7;
}

/* ---- 주사위 등급 헬퍼 ----------------------------------------------------

   갈리면 '상세엔 3인데 판을 열면 1'이 난다. */
function diceTierIdx(hid){
  const n = CFG.diceTiers.length - 1;
  const v = (G.meta && G.meta.dice) ? G.meta.dice[hid] : 0;
  return clamp(Math.floor(v || 0), 0, n);
}
function diceTier(hid){ return CFG.diceTiers[diceTierIdx(hid)]; }
/* 주사위를 그릴 때 쓰는 색과 모양 — 영웅 색이 아니라 '등급' 색이다(David 지시).
   영웅 구분은 면에 그려진 무기 아이콘이 계속 해준다(마법사 물결·화염 / 궁수 화살·얼음). */
function dicePal(hid){ const T = diceTier(hid); return [T.col, T.col2, T.hi]; }
function diceLook(hid){ return diceTier(hid).look || CFG.diceTiers[0].look; }
/* 그 영웅이 '판을 시작할 때' 갖는 여섯 면. 등급의 base 를 깔고 시작한다.
   화면(영웅 상세·전투력)과 실제 판이 반드시 같은 값을 보게 이 함수만 쓴다. */
/* 판을 시작할 때의 6면. 눈금은 등급이 아니라 '면마다 올려 둔 칸수'가 정한다
   (2026-08-19 개편 — 그 전에는 diceTier().base 가 여섯 면을 한꺼번에 올렸다). */
function faceUps(hid){
  const m = (G.meta && G.meta.faceUp && G.meta.faceUp[hid]) || null;
  const n = CFG.heroes[hid].baseFaces.length;
  const out = [];
  for (let i = 0; i < n; i++) out.push(m ? clamp(Math.floor(m[i] || 0), 0, CFG.faceUp.max) : 0);
  return out;
}
function heroStartFaces(hid){
  const up = faceUps(hid);
  const sp = specialOn(hid) ? CFG.heroSpecial[hid] : null;
  const n  = CFG.heroes[hid].baseFaces.length;
  // 세 번째 무기가 열렸으면 마지막 면이 그 무기로 바뀐다(면 수는 그대로 6개)
  return CFG.heroes[hid].baseFaces.map((f, i) => ({ w:(sp && i === n - 1) ? sp : f.w, c:1 + up[i] }));
}
/* 그 면을 한 칸 더 올리는 데 드는 코인 */
function faceUpCost(hid, i){
  const F = CFG.faceUp;
  return F.cost + F.step * faceUps(hid)[i];
}
function faceUpBuy(hid, i){
  const F = CFG.faceUp, up = faceUps(hid);
  if (up[i] >= F.max) return false;
  const cost = faceUpCost(hid, i);
  if (G.meta.cur[F.cur] < cost) return false;
  G.meta.cur[F.cur] -= cost;
  if (!G.meta.faceUp) G.meta.faceUp = {};
  if (!G.meta.faceUp[hid]) G.meta.faceUp[hid] = [];
  G.meta.faceUp[hid][i] = up[i] + 1;
  save();
  return true;
}

/* 발사 한 발당 짧은 진동.
   ⚠ navigator.vibrate 는 안드로이드 크롬만 지원한다 — iOS 사파리에는 없어서 조용히 넘어간다 */
let lastVib = -1;
function buzz(){
  if (!G.meta || !G.meta.vibrate) return;
  if (typeof navigator === 'undefined' || !navigator.vibrate) return;
  if (G.t - lastVib < CFG.haptic.minGap) return;
  lastVib = G.t;
  try { navigator.vibrate(CFG.haptic.shot); } catch (e) { /* 무시 */ }
}
/* 영웅 하나 = 자기 주사위 6면 + 자기 굴림 주기 + 자기 경험치/레벨 */
function newHero(hid){
  // 2026-08-19: 시작 눈금은 면마다 코인으로 올려 둔 칸수가 정한다(등급과 무관).
  const faces = heroStartFaces(hid);
  // 그 위에 무작위로 두 면만 한 눈금 더 얹는다 — 같은 영웅이라도 판마다 출발이 조금씩 다르다.
  //   (등급이 올라도 이 '들쭉날쭉함'은 그대로 남는다)
  const idx = [];
  for (let i = 0; i < faces.length; i++) idx.push(i);
  for (const i of shuffle(idx).slice(0, CFG.dice.startTwos)) faces[i].c += 1;
  return { faces:faces, cdMul:1, level:1, xp:0 };
}
/* 판 하나가 끝나면 전부 처음 상태로 돌아간다 — 면값·굴림 주기·경험치·레벨,
   그리고 어떤 영웅이 나와 있었는지까지.
   근거: 참고 화면에서 웨이브 1/8 과 웨이브 1/12 이 둘 다 XP 0/15 였다.
   매 전투 시작 때 영웅 선택 화면에서 한 명을 고르고,
   나머지 한 명은 전투 중 3택의 '배치' 카드로 합류한다. */
function resetHeroes(run){
  run.heroes = { mage:null, archer:null };
  run.order  = [];                    // 합류한 차례. 이게 곧 하단 슬롯 자리다
}

/* 영웅 한 명을 판에 세운다. 부르는 곳이 둘이라(영웅 선택 화면 · 전투 중 합류 카드)
   자리 계산을 여기 한 곳에 둔다 — 호출처마다 적으면 반드시 하나가 빠진다. */
function addHero(run, hid){
  if (run.heroes[hid]) return run.heroes[hid];
  run.heroes[hid] = newHero(hid);
  if (!run.order) run.order = [];
  run.order.push(hid);
  // 전투 중에 합류했으면 굴릴 주사위도 여기서 같이 만든다.
  // 부르는 쪽에 맡기면 새 합류 경로가 생길 때마다 빠뜨린다 — 실제로 빠뜨려서 화면이 터졌다
  if (G.b && G.b.dice && !G.b.dice[hid]) G.b.dice[hid] = newDiceRt(hid);
  layout();                           // 자리가 바뀌었으니 슬롯을 다시 잡는다
  return run.heroes[hid];
}
