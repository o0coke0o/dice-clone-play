function drawLevelUp(){
  drawBattle();
  if (G.b.roul){ drawRoulette(); return; }     // 카드를 골랐으면 룰렛이 돈다
  HIT = [];                            // 배경으로 그린 전투 화면의 버튼은 살려두지 않는다
  ctx.fillStyle = 'rgba(10,14,8,0.72)';
  ctx.fillRect(0, 0, L.w, L.h);

  // 리본 배너 — 어느 영웅의 레벨업인지 색으로 구분한다(마법사 파랑 / 궁수 초록)
  const HH = CFG.heroes[(G.b && G.b.lvHero) || 'mage'];
  const by = L.h * 0.20, bw = L.w - 56, bx = 28;
  ctx.fillStyle = HH.card;
  ctx.beginPath();
  ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by);
  ctx.lineTo(bx + bw, by + 44); ctx.lineTo(bx, by + 44);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillRect(bx, by + 4, bw, 14);
  txtOut('업그레이드 선택', L.w / 2, by + 22, 21, '#fff', 'center', 5);
  // 어느 영웅의 레벨업인지 — 영웅이 둘이면 반드시 필요하다
  if (G.b && G.b.lvHero){
    txtOut(HH.name + ' 레벨 업', L.w / 2, by + 58, 15, HH.cardTop, 'center', 4);
  }

  const cards = (G.b && G.b.cards) || [];
  const n = Math.max(1, cards.length);
  const gap = 8, cw = Math.min(104, (L.w - 32 - gap * (n - 1)) / n), chh = 176;
  const x0 = (L.w - (cw * n + gap * (n - 1))) / 2, y0 = by + 74;
  for (let i = 0; i < cards.length; i++) drawUpCard(x0 + i * (cw + gap), y0, cw, chh, cards[i]);
}

function drawUpCard(x, y, w, h, c){
  const H = CFG.heroes[cardHero()];
  ctx.fillStyle = H.card; rr(x, y, w, h, 10); ctx.fill();
  ctx.fillStyle = H.cardTop;
  ctx.save(); rr(x, y, w, h, 10); ctx.clip();
  ctx.fillRect(x, y, w, 46);
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 2; rr(x, y, w, h, 10); ctx.stroke();

  txtOut(c.name, x + w / 2, y + 16, 14, '#fff', 'center', 3);
  star(x + w / 2, y + 34, 6);

  if (c.hero){
    // 영웅 배치 카드 — 그 영웅 얼굴을 보여준다
    heroPortrait(c.hero, x + (w - 48) / 2, y + 58, 48, 48);
    txtOut('NEW', x + w / 2, y + 118, 15, '#57ef4a', 'center', 3);
  } else if (c.targets.length){
    // 대상 면의 현재값 타일 + 초록 증가분 (레벨업한 영웅의 면)
    const hh = G.run.heroes[cardHero()];
    const n = c.targets.length;
    const tw = n === 1 ? 46 : (n === 2 ? 38 : 28), tgap = 4;
    const tx0 = x + (w - (tw * n + tgap * (n - 1))) / 2, ty = y + 62;
    for (let i = 0; i < n; i++){
      const f = hh.faces[c.targets[i]];
      faceTile(tx0 + i * (tw + tgap), ty, tw, tw, f, { pal:dicePal(cardHero()) });
      // 값이 아니라 '폭'을 보여준다 — 고르면 룰렛이 이 안에서 하나를 정한다
      txtOut('+' + c.roll.min + '~' + c.roll.max, tx0 + i * (tw + tgap) + tw / 2, ty + tw + 12,
             n === 3 ? 11 : 14, '#57ef4a', 'center', 3);
    }
  } else {
    hourglass(x + w / 2, y + 92, 24);
  }

  let foot = c.foot;
  if (c.kind === 'cd' && c.roll) foot = c.foot + ' -' + c.roll.min + '~' + c.roll.max + '%';
  txt(foot, x + w / 2, y + h - 16, foot.length > 6 ? 9 : 11, '#f0f6ff', 'center');
  if (!c.noTap){
    HIT.push({ x:x, y:y, w:w, h:h, fn:(function(cc){ return function(){ takeCard(cc); }; })(c) });
  }
}

/* 룰렛 화면 — 고른 카드의 값이 정해지는 연출.
   값은 startRoulette 에서 이미 정해져 있고 여기서는 '돌다가 그 값에 멈추는' 그림만 그린다.
   ⚠ 그리는 동안 Math.random 을 쓰면 프레임마다 달라져 어지럽다 —
     G.t 로 흔들어 숫자를 바꾼다(같은 프레임에서는 항상 같은 값). */
function drawRoulette(){
  const b = G.b, R = b.roul, U = CFG.up.roulette;
  const c = R.card, hid = R.mode === 'mimic' ? b.mimicHero : b.lvHero;
  const H = CFG.heroes[hid || 'mage'];
  HIT = [];
  ctx.fillStyle = 'rgba(10,14,8,0.82)';
  ctx.fillRect(0, 0, L.w, L.h);

  const spinning = R.t < U.spin;
  const p = clamp(R.t / U.spin, 0, 1);
  // 끝으로 갈수록 느려진다 — 숫자 바뀌는 간격이 벌어진다
  const tick = U.tick * (1 + p * p * 7);

  const by = L.h * 0.24, bw = L.w - 56, bx = 28;
  ctx.fillStyle = H.card; ctx.fillRect(bx, by, bw, 44);
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(bx, by + 4, bw, 14);
  txtOut(spinning ? '결정 중' : '결정!', L.w / 2, by + 22, 21, '#fff', 'center', 5);
  txtOut(c.name + (c.foot ? '  ·  ' + c.foot : ''), L.w / 2, by + 60, 14, H.cardTop, 'center', 4);

  // 숫자 칸 — 대상 면 수만큼(속도 카드는 한 칸)
  const n = R.vals ? R.vals.length : 1;
  const cw = Math.min(72, Math.floor((L.w - 60) / n)), gap = 8;
  const x0 = (L.w - (cw * n + gap * (n - 1))) / 2, sy = by + 86;
  for (let i = 0; i < n; i++){
    const x = x0 + i * (cw + gap);
    let v = R.vals[i];
    if (spinning){
      // 아직 도는 중 — 범위 안 값들이 지나간다
      const steps = Math.floor((c.roll.max - c.roll.min) / c.roll.step) + 1;
      v = c.roll.min + c.roll.step * (Math.floor(R.t / tick + i * 1.7) % steps);
    }
    ctx.fillStyle = spinning ? '#3b4450' : '#2e7d32';
    rr(x, sy, cw, cw, 8); ctx.fill();
    ctx.strokeStyle = spinning ? 'rgba(255,255,255,0.25)' : '#ffd75e';
    ctx.lineWidth = spinning ? 2 : 3;
    rr(x, sy, cw, cw, 8); ctx.stroke();
    txtOut((c.kind === 'cd' ? '' : '+') + v + (c.kind === 'cd' ? '%' : ''),
           x + cw / 2, sy + cw / 2, Math.round(cw * (c.kind === 'cd' ? 0.34 : 0.44)),
           spinning ? '#e9eef2' : '#fff', 'center', 4);
  }

  txt(spinning ? ('폭 ' + c.roll.min + ' ~ ' + c.roll.max + ' 안에서 정해집니다')
               : (c.targets.length > 1 ? '면마다 따로 정해집니다' : ''),
      L.w / 2, sy + cw + 22, 11, '#a8b6c8', 'center');
  if (!spinning) txt('탭하여 계속', L.w / 2, sy + cw + 42, 12, '#f0f4ea', 'center');

  // 어디를 눌러도 건너뛴다 — 결과는 이미 정해져 있어서 바뀌지 않는다
  HIT.push({ x:0, y:0, w:L.w, h:L.h, fn:function(){
    if (R.t < U.spin) R.t = U.spin;      // 첫 탭은 '빨리 감기'
    else applyRoulette();
  } });
}

/* 미믹 보상 화면 — 카드 하나와 확인 버튼 */

/* 네 갈래 반짝임 — 높은 등급 주사위 주위에서 깜빡인다 */
function sparkle4(x, y, s, col){
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.quadraticCurveTo(x + s * 0.16, y - s * 0.16, x + s, y);
  ctx.quadraticCurveTo(x + s * 0.16, y + s * 0.16, x, y + s);
  ctx.quadraticCurveTo(x - s * 0.16, y + s * 0.16, x - s, y);
  ctx.quadraticCurveTo(x - s * 0.16, y - s * 0.16, x, y - s);
  ctx.closePath(); ctx.fill();
}

function star(x, y, s){
  ctx.fillStyle = '#ffd54a';
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = (i % 2 ? s * 0.45 : s);
    ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
  }
  ctx.closePath(); ctx.fill();
}

function hourglass(x, y, s){
  ctx.strokeStyle = '#eaf2ff'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x - s * 0.6, y - s); ctx.lineTo(x + s * 0.6, y - s);
  ctx.lineTo(x, y); ctx.lineTo(x + s * 0.6, y + s);
  ctx.lineTo(x - s * 0.6, y + s); ctx.lineTo(x, y);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = '#fdf3c4';
  ctx.beginPath();
  ctx.moveTo(x - s * 0.5, y + s * 0.9); ctx.lineTo(x + s * 0.5, y + s * 0.9);
  ctx.lineTo(x, y + s * 0.1);
  ctx.closePath(); ctx.fill();
}

function drawChest(y){

/* ============================================================================
   카드팩 — 판을 하나 끝내면 재화와 함께 카드 한 장이 나온다.
   뒷면 세 장을 펼치고 그중 하나를 고른다.
   ========================================================================== */
/* 카드 뒷면 */
function packBack(x, y, w, h, i){
  ctx.fillStyle = '#3b2a6b'; rr(x, y, w, h, 10); ctx.fill();
  ctx.fillStyle = '#543d97'; rr(x + 5, y + 5, w - 10, h - 10, 7); ctx.fill();
  ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 2; rr(x + 5, y + 5, w - 10, h - 10, 7); ctx.stroke();
  // 가운데 별 하나 + 위아래로 작은 별. 카드마다 반짝임이 어긋나게 i 를 섞는다
  const cx = x + w / 2, cy = y + h / 2;
  ctx.globalAlpha = 0.55 + 0.35 * Math.sin(G.t * 3 + i * 1.7);
  star(cx, cy, Math.min(w, h) * 0.20);
  ctx.globalAlpha = 0.35;
  star(cx, cy - h * 0.28, Math.min(w, h) * 0.07);
  star(cx, cy + h * 0.28, Math.min(w, h) * 0.07);
  ctx.globalAlpha = 1;
}

/* 재화 카드 — 스킬이 아직 부족해서 빈 자리를 채우는 임시 카드 */
function packCurCard(x, y, w, h, c){
  ctx.fillStyle = '#8a5a2b'; rr(x, y, w, h, 10); ctx.fill();
  ctx.save(); rr(x, y, w, h, 10); ctx.clip();
  ctx.fillStyle = '#a86f35'; ctx.fillRect(x, y, w, Math.max(15, Math.round(h * 0.24)));
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 2; rr(x, y, w, h, 10); ctx.stroke();
  txtOut('재화', x + w / 2, y + Math.max(15, Math.round(h * 0.24)) / 2 + 1, 14, '#fff', 'center', 3);
  icoCur(c.k, x + w / 2, y + h * 0.48, Math.max(12, Math.round(h * 0.15)));
  txtOut('+' + c.n, x + w / 2, y + h * 0.74, Math.max(16, Math.round(h * 0.14)), '#ffd75e', 'center', 4);
}

function packFront(x, y, w, h, c){
  if (c.kind === 'skill') skillCard(x, y, w, h, c.sk, { big:true });
  else packCurCard(x, y, w, h, c);
}

function drawPack(b){
  const pk = b.pack, done = pk.picked >= 0;
  const t = clamp(pk.flipT / CFG.skills.packFlip, 0, 1);

  txtOut('카드팩', L.w / 2, L.h * 0.12, 30, '#ffe6a8', 'center', 7);

  if (!done){
    txt('한 장을 고르세요', L.w / 2, L.h * 0.12 + 26, 13, '#f0f4ea', 'center');

    const n = pk.cards.length, gap = 10;
    const cw  = Math.min(102, Math.floor((L.w - 36 - gap * (n - 1)) / n));
    const chh = Math.round(cw * 1.42);
    const x0  = Math.round((L.w - (cw * n + gap * (n - 1))) / 2);
    const y   = Math.round(L.h * 0.28);

    for (let i = 0; i < n; i++){
      const x = x0 + i * (cw + gap);
      // 살짝 떠 있는 느낌만 준다. 눌러야 할 곳이 흔들리면 안 되므로 판정은 고정 위치로
      packBack(x, y + Math.sin(G.t * 2.2 + i * 1.1) * 3, cw, chh, i);
      HIT.push({ x:x, y:y, w:cw, h:chh, fn:(function(k){
        return function(){ takePackCard(k); };
      })(i) });
    }
    txt('고른 카드는 주문서 탭에 모입니다', L.w / 2, y + chh + 30, 11, '#a8b6c8', 'center');
    return;
  }

  // 고른 카드 — 뒤집히며 앞면이 나온다
  const c  = pk.cards[pk.picked];
  const bw = Math.min(150, L.w - 90), bh = Math.round(bw * 1.42);
  const bx = Math.round((L.w - bw) / 2), by = Math.round(L.h * 0.26);
  const sc = Math.abs(Math.cos(Math.PI * t));            // 1 → 0 → 1 로 좁아졌다 펴진다

  ctx.save();
  ctx.translate(bx + bw / 2, by + bh / 2);
  ctx.scale(Math.max(0.02, sc), 1);
  ctx.translate(-(bx + bw / 2), -(by + bh / 2));
  if (t < 0.5) packBack(bx, by, bw, bh, pk.picked);
  else         packFront(bx, by, bw, bh, c);
  ctx.restore();

  if (t < 1) return;                                     // 다 뒤집힌 뒤에 문구를 낸다

  let ty = by + bh + 26;
  if (c.kind === 'skill'){
    txtOut(c.sk.name + '  Lv' + (c.lvAfter || 1) + ' 획득',
           L.w / 2, ty, 17, '#ffd75e', 'center', 4); ty += 22;
    txt(skillEffectText(c.sk), L.w / 2, ty, 11, '#9ff0a6', 'center'); ty += 20;
  } else {
    txtOut('재화 +' + c.n, L.w / 2, ty, 17, '#ffd75e', 'center', 4); ty += 22;
  }
  txtOut('탭하여 다음 판', L.w / 2, ty + 8, 14, '#fff', 'center', 3);
}

function homeChrome(){

/* 리본 배너 */
function ribbon(y, text, col, size){
  const bw = L.w - 76, bx = 38;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(bx, y); ctx.lineTo(bx + bw, y);
  ctx.lineTo(bx + bw - 10, y + 20); ctx.lineTo(bx + bw, y + 40);
  ctx.lineTo(bx, y + 40); ctx.lineTo(bx + 10, y + 20);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(bx + 10, y + 4, bw - 20, 12);
  txtOut(text, L.w / 2, y + 20, size || 19, '#fff', 'center', 5);
  return y + 40;
}

function drawMain(){

  ctx.beginPath(); ctx.arc(gx, gy, 4.6, 0, TAU); ctx.fill();

  const pvTop = by + 54;
  const pvW = Math.max(90, Math.min(190, L.w - 110, prY - 20 - pvTop));

  ctx.fillStyle = '#2b4a6b'; rr(pvX, pvY, pvW, pvW, 12); ctx.fill();

  ctx.strokeStyle = '#101c2c'; ctx.lineWidth = 2; rr(pvX, pvY, pvW, pvW, 12); ctx.stroke();
  const px0 = pvX + pvW / 2, py0 = pvY + pvW / 2;
  previewEnemy(px0 + pvW * 0.10, py0 - pvW * 0.16, pvW * 0.15, true);
  previewEnemy(px0 - pvW * 0.20, py0 + pvW * 0.02, pvW * 0.10, false);
  previewEnemy(px0 - pvW * 0.06, py0 + pvW * 0.12, pvW * 0.10, false);
  previewEnemy(px0 + pvW * 0.16, py0 + pvW * 0.20, pvW * 0.10, false);

  // 판 진행
  ctx.fillStyle = '#2b4a6b'; rr(prX, prY, prW, prH, 8); ctx.fill();
  ctx.strokeStyle = '#101c2c'; ctx.lineWidth = 2; rr(prX, prY, prW, prH, 8); ctx.stroke();
  txt('판 ' + r.stage + '/' + CFG.stage.perWorld, L.w / 2, prY + 11, 12, '#fff', 'center');

    ctx.fillRect(prX + 6 + i * sw, prY + 21, Math.max(1, sw - 1), 11);

  // 전투 버튼 — 영웅이 아직 없으면 먼저 고르게 한다

           else G.screen = 'pick';

/* 하단 탭 5칸. '주문서'·'전투'·'영웅'이 동작한다. 나머지는 아직 없으므로 자물쇠 */
function drawNav(active){
  const nh = 56, ny = L.h - nh, cw = L.w / 5;
  const tabs = [
    { key:'tower',  name:'성탑' },
    { key:'spell',  name:'주문서' },
    { key:'battle', name:'전투' },
    { key:'heroes', name:'영웅' },
    { key:'shop',   name:'상점' },
  ];
  for (let i = 0; i < tabs.length; i++){
    const t = tabs[i], x = i * cw, on = t.key === active;
    const live = t.key === 'battle' || t.key === 'heroes' || t.key === 'spell';
    ctx.fillStyle = on ? '#f0b429' : (live ? '#a7b1a8' : '#8f9a92');
    ctx.fillRect(x, ny, cw - 1, nh);

    if (t.key === 'battle'){
      ctx.strokeStyle = on ? '#e9eef2' : '#5c6660'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + cw * 0.28, ny + 34); ctx.lineTo(x + cw * 0.72, ny + 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + cw * 0.72, ny + 34); ctx.lineTo(x + cw * 0.28, ny + 12); ctx.stroke();
      ctx.lineCap = 'butt';
    } else if (t.key === 'spell'){
      // 펼친 책 — 모아둔 스킬 카드를 보는 곳
      const bx0 = x + cw / 2, by0 = ny + 22;
      ctx.fillStyle = on ? '#7a4a12' : '#4a5b52';
      ctx.beginPath();
      ctx.moveTo(bx0 - 15, by0 - 9); ctx.lineTo(bx0 - 1, by0 - 5);
      ctx.lineTo(bx0 - 1, by0 + 11); ctx.lineTo(bx0 - 15, by0 + 7);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx0 + 15, by0 - 9); ctx.lineTo(bx0 + 1, by0 - 5);
      ctx.lineTo(bx0 + 1, by0 + 11); ctx.lineTo(bx0 + 15, by0 + 7);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = on ? '#fff3d0' : '#8f9a92';
      ctx.fillRect(bx0 - 12, by0 - 5, 10, 2); ctx.fillRect(bx0 + 2, by0 - 5, 10, 2);
      ctx.fillRect(bx0 - 12, by0 + 1, 10, 2); ctx.fillRect(bx0 + 2, by0 + 1, 10, 2);
    } else if (t.key === 'heroes'){
      // 색색 정육면체 세 개 (원본 아이콘)
      const cx0 = x + cw / 2;
      const cube = (px, py, s, c1, c2) => {
        ctx.fillStyle = c1; rr(px - s / 2, py - s / 2, s, s, 3); ctx.fill();
        ctx.fillStyle = c2; rr(px - s / 2, py, s, s / 2, 3); ctx.fill();
      };
      cube(cx0,          ny + 13, 13, '#ffd54a', '#d19b12');
      cube(cx0 - 8,      ny + 26, 13, '#57c86a', '#2b8f45');

/* ============================================================================
   주문서 탭 — 모은 스킬 카드 4x4
   카드는 판이 끝날 때 나오는 카드팩으로만 늘어난다(여기서 사는 것이 아니다).
   ========================================================================== */

/* 스킬 아이콘. 지금은 폭발형 하나뿐이라 effect.stat 으로 고른다 */
function skillIcon(sk, cx, cy, s){
  const st = sk.effect && sk.effect.stat;
  if (st === 'splashR'){
    // 퍼지는 폭발 — 안쪽 불꽃 + 바깥 파문 두 겹
    ctx.strokeStyle = 'rgba(255,236,180,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, s, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,236,180,0.30)';
    ctx.beginPath(); ctx.arc(cx, cy, s * 1.34, 0, TAU); ctx.stroke();
    const rg = ctx.createRadialGradient(cx, cy, 0.5, cx, cy, s * 0.78);
    rg.addColorStop(0, '#fff6cf'); rg.addColorStop(0.55, '#ffb03a'); rg.addColorStop(1, '#e8452a');
    ctx.fillStyle = rg;
    ctx.beginPath();
    for (let i = 0; i < 12; i++){
      const a = -Math.PI / 2 + i * TAU / 12, rr2 = (i % 2 ? s * 0.40 : s * 0.78);
      ctx.lineTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2);
    }
    ctx.closePath(); ctx.fill();
    return;
  }
  star(cx, cy, s * 0.8);
}

/* 카드 한 장. 주문서 탭(작게)과 카드팩(크게)이 같이 쓴다.
   sel=선택 테두리, big=이름 아래 설명까지 넣는 큰 카드 */
function skillCard(x, y, w, h, sk, opt){
  opt = opt || {};
  const soon = !!sk.soon;
  const lv   = soon ? 0 : skillLv(sk.id);
  const own  = lv > 0;
  const H    = (!soon && sk.hero && CFG.heroes[sk.hero]) || null;

  // 색 — 얻은 카드만 영웅 색으로 칠한다. 못 얻은 칸은 회색이라 한눈에 갈린다
  const base = soon ? '#6c766f' : (own ? (H ? H.card    : '#6f52c8') : '#9aa39b');
  const top  = soon ? '#7e8880' : (own ? (H ? H.cardTop : '#9a82ee') : '#b0b8b1');

  ctx.fillStyle = base; rr(x, y, w, h, 8); ctx.fill();
  ctx.save(); rr(x, y, w, h, 8); ctx.clip();
  ctx.fillStyle = top; ctx.fillRect(x, y, w, Math.max(15, Math.round(h * 0.24)));
  ctx.restore();
  ctx.strokeStyle = opt.sel ? '#ffd75e' : (opt.on ? '#57ef4a' : 'rgba(0,0,0,0.45)');
  ctx.lineWidth   = opt.sel ? 3 : (opt.on ? 2.5 : 2);
  rr(x, y, w, h, 8); ctx.stroke();
  // 켜 둔 카드는 초록 테두리 + 오른쪽 위 점 하나. 꺼 둔 것과 한눈에 갈려야 한다
  if (opt.on){
    ctx.fillStyle = '#57ef4a';
    ctx.beginPath(); ctx.arc(x + w - 8, y + 8, 3.4, 0, TAU); ctx.fill();
  }

  const headY = y + Math.max(15, Math.round(h * 0.24)) / 2 + 1;

  if (soon){
    txt('준비 중', x + w / 2, headY, 9, 'rgba(255,255,255,0.75)', 'center');
    txtOut('?', x + w / 2, y + h * 0.62, Math.round(h * 0.34), 'rgba(255,255,255,0.55)', 'center', 3);
    return;
  }

  txtOut(sk.name, x + w / 2, headY, opt.big ? 15 : 10, '#fff', 'center', opt.big ? 3 : 2);

  // 가운데 아이콘 — 못 얻은 카드는 어둡게 깔고 자물쇠를 얹는다
  const icY = y + h * (opt.big ? 0.46 : 0.50);
  ctx.globalAlpha = own ? 1 : 0.30;
  skillIcon(sk, x + w / 2, icY, Math.max(9, h * (opt.big ? 0.15 : 0.17)));
  ctx.globalAlpha = 1;
  if (!own){
    const lx = x + w / 2, ly = icY + 2;
    ctx.strokeStyle = '#3d443f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(lx, ly - 5, 5, Math.PI, TAU); ctx.stroke();
    ctx.fillStyle = '#3d443f'; rr(lx - 8, ly - 5, 16, 12, 3); ctx.fill();
  }

  if (opt.big && sk.desc){
    txt(sk.desc, x + w / 2, y + h * 0.72, 10, '#eef4ff', 'center');
  }

  // 레벨 눈금 — 몇 장 모았는지. 상한(maxLv)만큼 점을 찍는다
  const n = CFG.skills.maxLv, dr = opt.big ? 4 : 3, dg = opt.big ? 13 : 9;
  const dx0 = x + w / 2 - (n - 1) * dg / 2, dy = y + h - (opt.big ? 16 : 10);
  for (let i = 0; i < n; i++){
    ctx.fillStyle = i < lv ? '#ffd75e' : 'rgba(0,0,0,0.32)';
    ctx.beginPath(); ctx.arc(dx0 + i * dg, dy, dr, 0, TAU); ctx.fill();
  }
}

/* 이 카드가 지금 무엇을 얼마나 바꾸고 있는가 — 설명칸에 쓰는 한 줄.
   ⚠ 표시용 계산이라 실제 전투는 splashR() 을 쓴다. 형식을 늘릴 때 둘 다 손볼 것 */
function skillEffectText(sk){
  const e = sk.effect;
  if (!e) return '';
  const lv = skillLv(sk.id);
  if (e.stat === 'splashR'){
    const b0 = CFG.missile[e.w].splashR;
    const now = Math.round(b0 * (1 + e.mulPerLv * lv));
    const nxt = Math.round(b0 * (1 + e.mulPerLv * (lv + 1)));
    if (lv <= 0) return '폭발 반경 ' + b0 + ' · 얻으면 ' + nxt;
    if (lv >= CFG.skills.maxLv) return '폭발 반경 ' + b0 + ' → ' + now + ' (최고 레벨)';
    return '폭발 반경 ' + b0 + ' → ' + now + ' · 다음 레벨 ' + nxt;
  }
  return '';
}

function skillsOf(hid){
  // 그 영웅 카드 + 영웅을 안 가리는 공용 카드. 공용은 모든 탭에 같이 보인다
  const out = [];
  for (const sk of CFG.skills.list){
    if (sk.soon) continue;
    if (sk.hero && sk.hero !== hid) continue;
    out.push(sk);
  }
  return out;
}

function drawSpells(){
  homeChrome();
  const top = ribbon(56, '주문서', '#6f52c8') + 16;

  // ── 캐릭터 탭 — 스킬은 캐릭터마다 다르다(2026-08-19 David 지시) ──
  const heroes = ownedHeroes();
  if (heroes.indexOf(G.spellTab) < 0) G.spellTab = heroes[0];
  const hid = G.spellTab;
  const tw = Math.min(96, Math.floor((L.w - 24) / heroes.length)), tgap = 4;
  const tx0 = Math.round((L.w - (tw * heroes.length + tgap * (heroes.length - 1))) / 2);
  for (let i = 0; i < heroes.length; i++){
    const h2 = heroes[i], on = h2 === hid, H2 = CFG.heroes[h2];
    const x = tx0 + i * (tw + tgap);
    ctx.fillStyle = on ? H2.card : 'rgba(20,26,34,0.55)';
    rr(x, top, tw, 26, 6); ctx.fill();
    if (on){ ctx.fillStyle = 'rgba(255,255,255,0.22)'; rr(x + 3, top + 3, tw - 6, 8, 3); ctx.fill(); }
    txtOut(H2.name, x + tw / 2, top + 13, 12, on ? '#fff' : '#9aa6b4', 'center', on ? 3 : 2);
    if (!on){
      HIT.push({ x:x, y:top, w:tw, h:26, fn:(function(k){
        return function(){ G.spellTab = k; G.spellSel = null; };
      })(h2) });
    }
  }

  // ── 칸 안내 — 등급이 몇 개를 켤 수 있게 해주는지 ──
  const T = diceTier(hid), used = equipList(hid).length, cap = equipMax(hid);
  const list = skillsOf(hid);
  let have = 0;
  for (const sk of list) if (skillLv(sk.id) > 0) have++;
  txt('모은 카드 ' + have + '개  ·  켤 수 있는 칸 ' + used + '/' + cap + ' (' + T.name + ' 주사위)',
      L.w / 2, top + 40, 11, used >= cap ? '#ffd75e' : '#8fa2c0', 'center');

  // ── 4x4 격자 ──
  const cols = CFG.skills.cols, rows = CFG.skills.rows;
  // 세로가 짧은 폰에서는 설명칸을 줄여서라도 4x4 를 통째로 넣는다(스크롤은 만들지 않는다)
  const pad = 12, gap = 7, navH = 56;
  const detailH = L.h < 560 ? 62 : 78;
  const gy0    = top + 52;
  const bottom = L.h - navH - 8;
  const availH = bottom - detailH - gy0;
  const cw  = Math.floor((L.w - pad * 2 - gap * (cols - 1)) / cols);
  const chh = clamp(Math.floor((availH - gap * (rows - 1)) / rows), 40, Math.round(cw * 1.30));
  const gx  = Math.round((L.w - (cw * cols + gap * (cols - 1))) / 2);
  const gridH  = rows * (chh + gap) - gap;
  const blockH = gridH + 9 + (detailH - 6);
  const gy = gy0 + Math.max(0, Math.round((bottom - gy0 - blockH) / 2));

  for (let i = 0; i < cols * rows; i++){
    const sk = list[i] || { soon:true, id:'empty' + i };
    const x = gx + (i % cols) * (cw + gap), y = gy + Math.floor(i / cols) * (chh + gap);
    skillCard(x, y, cw, chh, sk, { sel:G.spellSel === sk.id, on:isEquipped(sk) });
    if (!sk.soon){
      HIT.push({ x:x, y:y, w:cw, h:chh, fn:(function(id){
        return function(){ G.spellSel = (G.spellSel === id) ? null : id; };
      })(sk.id) });
    }
  }

  // ── 설명칸 + 켜기/끄기 ──
  const dy = gy + gridH + 9;
  // 계측용 — 4x4 + 설명칸이 하단 탭 위에 다 들어갔는지 밖에서 재보려고 남긴다
  G._spellGeo = { gy:gy, cw:cw, chh:chh, gridBottom:gy + gridH,
                  detailBottom:dy + detailH - 6, navTop:L.h - navH };
  ctx.fillStyle = 'rgba(10,14,20,0.55)'; rr(pad, dy, L.w - pad * 2, detailH - 6, 8); ctx.fill();
  const sel = G.spellSel ? skillDef(G.spellSel) : null;
  if (sel){
    const lv = skillLv(sel.id), on = isEquipped(sel);
    txtOut(sel.name + (lv ? '  Lv' + lv : '  (아직 없음)'), L.w / 2 - 44, dy + 16, 13,
           lv ? '#ffd75e' : '#c3ccd6', 'center', 3);
    txt(sel.desc || '', L.w / 2 - 44, dy + 34, 10, '#c3ccd6', 'center');
    txt(skillEffectText(sel), L.w / 2 - 44, dy + 50, 10, '#9ff0a6', 'center');
    if (lv > 0){
      const bw2 = 74, bx2 = L.w - pad - bw2 - 8, by2 = dy + 12, bh2 = detailH - 34;
      const full = !on && used >= cap;
      ctx.fillStyle = on ? '#c0522d' : (full ? '#7d868e' : '#3ac13a');
      rr(bx2, by2, bw2, bh2, 6); ctx.fill();
      txtOut(on ? '끄기' : (full ? '칸 없음' : '켜기'), bx2 + bw2 / 2, by2 + bh2 / 2 - 6,
             on || !full ? 14 : 11, '#fff', 'center', 3);
      txt(on ? '칸이 빈다' : (full ? '등급을 올리세요' : '칸 ' + (used + 1) + '/' + cap),
          bx2 + bw2 / 2, by2 + bh2 - 9, 9, '#f0f6ff', 'center');
      if (on || !full){
        HIT.push({ x:bx2, y:by2, w:bw2, h:bh2, fn:function(){ toggleEquip(hid, sel.id); } });
      }
    }
  } else {
    txt('카드를 누르면 설명과 켜기 단추가 나옵니다', L.w / 2, dy + 22, 11, '#8fa2c0', 'center');
    txt('켜 둔 카드만 전투에 먹힙니다 — 칸은 주사위 등급이 늘려줍니다',
        L.w / 2, dy + 40, 10, '#7d8a99', 'center');
    txt('카드는 판을 끝낼 때 나오는 카드팩으로 모읍니다', L.w / 2, dy + 56, 10, '#7d8a99', 'center');
  }

  drawNav('spell');
}


/* ============================================================================
   영웅 탭 — 보유 영웅과 잠금 예정 목록
   ========================================================================== */
function weaponsOf(hid){
  const set = [], seen = {};
  for (const f of CFG.heroes[hid].baseFaces){
    if (!seen[f.w]){ seen[f.w] = 1; set.push(f.w); }
  }
  return set;
}
/* 무기 다음 레벨 비용 */
function wcost(w){
  const W = CFG.weapons[w], lv = G.meta.wlv[w] || 1;
  return W.cost + W.costStep * (lv - 1);
}
/* 전투력 — 기본 6면의 총피해 × 계수. 무기 레벨만 반영되는 영구 수치다 */
function heroPower(hid){
  let sum = 0;
  // 2026-08-18: 주사위 등급이 시작 눈금을 올리므로 전투력도 그걸 반영해야 한다 —
  //   등급을 올렸는데 숫자가 그대로면 무엇이 세졌는지 알 수가 없다.
  for (const f of heroStartFaces(hid)) sum += f.c * wdmg(f.w);
  return Math.round(sum * CFG.power.coef);
}

function drawHeroes(){
  homeChrome();
  let y = ribbon(56, '영웅', '#3f79c8') + 22;

  // 보유 영웅
  const own = ownedHeroes();
  const cw = 104, chh = 128, gap = 14;
  const x0 = (L.w - (cw * own.length + gap * (own.length - 1))) / 2;
  for (let i = 0; i < own.length; i++){
    const hid = own[i], x = x0 + i * (cw + gap);
    ctx.fillStyle = '#cfd6dd'; rr(x, y, cw, chh, 9); ctx.fill();
    heroPortrait(hid, x + 4, y + 4, cw - 8, chh - 40);
    ctx.fillStyle = '#3f79c8'; rr(x + 4, y + chh - 34, cw - 8, 30, 5); ctx.fill();
    txtOut(CFG.heroes[hid].name, x + cw / 2, y + chh - 25, 12, '#fff', 'center', 3);
    // 이 영웅 강화에 쓰는 재화와 보유량
    const cur = CFG.weapons[weaponsOf(hid)[0]].cur;
    icoCur(cur, x + cw / 2 - 16, y + chh - 12, 14);
    txtOut(String(G.meta.cur[cur]), x + cw / 2 + 6, y + chh - 12, 14, '#fff', 'left', 3);
    HIT.push({ x:x, y:y, w:cw, h:chh, fn:(function(h){
      return function(){ G.heroView = h; G.screen = 'herodetail'; };
    })(hid) });
  }
  y += chh + 20;

  y = ribbon(y, '잠금 해제 예정', '#4a6b8a', 16) + 16;

  // 잠금 영웅 3열 그리드 — 남는 높이만큼만 그린다
  const navTop = L.h - 56;
  const gw = (L.w - 40 - 12) / 3, gh = 92;
  for (let i = 0; i < CFG.lockedHeroes.length; i++){
    const col = i % 3, row = Math.floor(i / 3);
    const gx = 20 + col * (gw + 6), gy = y + row * (gh + 8);
    if (gy + gh > navTop - 4) break;
    ctx.fillStyle = '#2b4a6b'; rr(gx, gy, gw, gh, 7); ctx.fill();
    silhouette(gx + gw / 2, gy + gh * 0.42, gh * 0.5);
    ctx.fillStyle = 'rgba(10,20,34,0.85)';
    rr(gx, gy + gh - 24, gw, 24, 5); ctx.fill();
    txt(CFG.lockedHeroes[i], gx + gw / 2, gy + gh - 12, 8.5, '#cfe0ff', 'center');
  }

  drawNav('heroes');
}

/* 잠금 영웅 실루엣 — 후드 쓴 사람 형태 */
function silhouette(x, y, h){
  ctx.fillStyle = 'rgba(6,14,26,0.8)';
  ctx.beginPath();
  ctx.arc(x, y - h * 0.22, h * 0.24, Math.PI * 0.9, Math.PI * 2.1);
  ctx.lineTo(x + h * 0.36, y + h * 0.5);
  ctx.lineTo(x - h * 0.36, y + h * 0.5);
  ctx.closePath(); ctx.fill();
}


/* ============================================================================
   영웅 상세 — 6면, 전투력, 무기 레벨업
   ========================================================================== */
function drawHeroDetail(){
  const hid = G.heroView || 'mage';
  const H = CFG.heroes[hid];
  homeChrome();

  const ribBottom = ribbon(46, H.name, H.card, 18);

  // 아래에서부터 자리를 잡는다 — 하단 탭과 겹치지 않게
  const navH = 56;
  const chh = 146, cardsY = L.h - navH - 10 - chh;
  // 2026-08-18 (David 지시): 무기 카드 위에 '주사위 등급' 줄을 한 칸 낸다.
  //   전투력을 그만큼 위로 밀고, 영웅 그림은 남는 높이에 맞춰 알아서 줄어든다(아래 availH).
  const dieH = 36, dieY = cardsY - 10 - dieH;
  const powH = 38, powY = dieY - 10 - powH;

  // 영웅 그림 + 좌우 6면. 남는 높이에 맞춰 크기를 줄인다
  const availH = powY - 10 - (ribBottom + 8);
  const ts = clamp(Math.floor((availH - 16) / 3), 22, 42);
  const pw = clamp(Math.min(L.w * 0.32, availH / 1.15), 60, 130);
  const px = (L.w - pw) / 2, py = ribBottom + 8 + Math.max(0, (availH - pw * 1.15) / 2);
  heroPortrait(hid, px, py, pw, pw * 1.15);

  // 6면은 '판을 시작할 때의 모습'이다.
  // 2026-08-19 (David 지시): 등급이 여섯 면을 한꺼번에 올리던 것을 없애고,
  //   면마다 코인으로 하나씩 올린다. 그래서 면 옆에 [+] 가 붙는다.
  const bf = heroStartFaces(hid), tgap = 6, up = faceUps(hid);
  const tTop = py + (pw * 1.15 - (ts * 3 + tgap * 2)) / 2;
  const F = CFG.faceUp, coin = G.meta.cur[F.cur];
  for (let i = 0; i < bf.length; i++){
    const left = i < 3, k = left ? i : i - 3;
    const tx = left ? px - ts - 10 : px + pw + 10;
    const ty2 = tTop + k * (ts + tgap);
    faceTile(tx, ty2, ts, ts, bf[i], { pal:dicePal(hid) });

    // [+] — 바깥쪽 모서리에 붙인다(가운데 얼굴을 가리지 않게)
    const maxed = up[i] >= F.max;
    const cost  = faceUpCost(hid, i);
    const can   = !maxed && coin >= cost;
    const bs    = Math.max(16, Math.round(ts * 0.52));
    const bx2   = left ? tx - bs - 3 : tx + ts + 3;
    const by2   = ty2 + (ts - bs) / 2;
    ctx.fillStyle = maxed ? '#6d7a71' : (can ? '#3ac13a' : '#b9c2c9');
    rr(bx2, by2, bs, bs, 4); ctx.fill();
    if (maxed){
      txtOut('MAX', bx2 + bs / 2, by2 + bs / 2, Math.round(bs * 0.36), '#dfe7ee', 'center', 2);
    } else {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, bs * 0.13); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx2 + bs * 0.28, by2 + bs / 2); ctx.lineTo(bx2 + bs * 0.72, by2 + bs / 2);
      ctx.moveTo(bx2 + bs / 2, by2 + bs * 0.28); ctx.lineTo(bx2 + bs / 2, by2 + bs * 0.72);
      ctx.stroke(); ctx.lineCap = 'butt';
      txtOut(String(cost), bx2 + bs / 2, by2 + bs + 7, 9, can ? '#ffd75e' : '#e26a5a', 'center', 2);
      if (can){
        HIT.push({ x:bx2 - 3, y:by2 - 3, w:bs + 6, h:bs + 6, fn:(function(k2){
          return function(){ faceUpBuy(hid, k2); };
        })(i) });
      }
    }
  }
  // 코인이 무엇에 쓰이는지 한 줄 — 안 적어두면 왜 [+] 가 회색인지 알 수 없다
  icoCur(F.cur, px + pw / 2 - 22, py + pw * 1.15 + 12, 13);
  txtOut(String(coin) + '  면 눈금 올리기', px + pw / 2 - 8, py + pw * 1.15 + 12, 11, '#fff', 'left', 3);

  // 전투력
  ctx.fillStyle = '#8f9a92'; rr(52, powY, L.w - 104, powH, 7); ctx.fill();
  ctx.fillStyle = '#ffd54a';
  ctx.beginPath(); ctx.arc(76, powY + powH / 2, 14, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e9eef2';
  ctx.beginPath();
  ctx.moveTo(76, powY + 7); ctx.lineTo(80, powY + powH / 2); ctx.lineTo(76, powY + powH - 7);
  ctx.lineTo(72, powY + powH / 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#a8453a'; rr(94, powY + 6, L.w - 104 - 50, powH - 12, 5); ctx.fill();
  txtOut(String(heroPower(hid)), 94 + (L.w - 104 - 50) / 2, powY + powH / 2, 18, '#fff', 'center', 4);

  // 주사위 등급 줄
  diceTierBar(20, dieY, L.w - 40, dieH, hid);

  // 영웅 전환 화살표
  const ord2 = ownedHeroes();
  const other = ord2[(ord2.indexOf(hid) + 1) % ord2.length];
  if (other !== hid){
    arrowBtn(24, powY + powH / 2, 'left', other);
    arrowBtn(L.w - 24, powY + powH / 2, 'right', other);
  }

  // 무기 카드
  const ws = weaponsOf(hid), n = ws.length + 1;
  const cwid = Math.min(104, (L.w - 20 - 6 * (n - 1)) / n);
  const cx0 = (L.w - (cwid * n + 6 * (n - 1))) / 2;
  for (let i = 0; i < ws.length; i++) weaponCard(cx0 + i * (cwid + 6), cardsY, cwid, chh, ws[i], H);
  lockedWeaponCard(cx0 + ws.length * (cwid + 6), cardsY, cwid, chh);

  // 뒤로 — 상단 왼쪽(카드와 겹치지 않는 자리)
  button(10, 46, 74, 30, '← 뒤로', function(){ G.screen = 'heroes'; }, '#4a5568', 12);
  drawNav('heroes');
}

function arrowBtn(x, y, side, target){
  const d = side === 'left' ? 1 : -1;   // 화살표 꼭짓점이 그 방향을 향하게
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(x + 6 * d, y - 12); ctx.lineTo(x - 6 * d, y); ctx.lineTo(x + 6 * d, y + 12);
  ctx.closePath(); ctx.fill();
  HIT.push({ x:x - 18, y:y - 20, w:36, h:40, fn:function(){ G.heroView = target; } });
}

/* ---- 주사위 등급 줄 (영웅 상세) -----------------------------------------
   2026-08-18 (David 지시): 주사위를 다이아로 영구 강화한다. 영웅마다 따로 오른다.
   왼쪽에 지금 등급과 시작 눈금, 오른쪽에 '다음 등급 + 비용' 버튼. 최고 등급이면 버튼 대신 안내.
   ⚠ 여기 비용·등급을 손으로 적지 말 것 — 전부 CFG.diceTiers 한 곳에서 읽는다. */
function diceTierBar(x, y, w, h, hid){
  const i = diceTierIdx(hid), T = CFG.diceTiers[i];
  const nx = CFG.diceTiers[i + 1] || null;

  ctx.fillStyle = '#8f9a92'; rr(x, y, w, h, 7); ctx.fill();

  // 지금 등급 — 작은 주사위 모양에 시작 눈금을 적는다
  const dx = x + 8, dy = y + (h - 24) / 2;
  ctx.fillStyle = T.col2; rr(dx, dy, 24, 24, 5); ctx.fill();
  ctx.fillStyle = T.col;  rr(dx + 2, dy + 2, 20, 20, 4); ctx.fill();
  txtOut(String(T.skills), dx + 12, dy + 12, 13, '#22303c', 'center', 2);

  txtOut(T.name + ' 주사위', dx + 32, y + h / 2 - 6, 12, '#fff', 'left', 3);
  txt('스킬 칸 ' + T.skills + '개', dx + 32, y + h / 2 + 8, 10, '#dfe7ee', 'left');

  if (!nx){
    txt('최고 등급', x + w - 12, y + h / 2, 11, '#ffd75e', 'right');
    return;
  }
  const cost = nx.cost, have = G.meta.cur.crystal, can = have >= cost;
  const bw = 118, bx = x + w - bw - 6, by = y + 5, bh = h - 10;
  ctx.fillStyle = can ? '#3ac13a' : '#b9c2c9'; rr(bx, by, bw, bh, 5); ctx.fill();
  txtOut(nx.name + ' →', bx + bw / 2, by + 8, 10, '#fff', 'center', 2);
  icoCur('crystal', bx + bw / 2 - 22, by + bh - 9, 12);
  txtOut(String(cost), bx + bw / 2 - 2, by + bh - 9, 12, can ? '#fff' : '#e26a5a', 'left', 2);
  if (can) HIT.push({ x:bx, y:by, w:bw, h:bh, fn:function(){ upgradeDice(hid); } });
}

/* 주사위 등급업 — 다이아를 쓴다. 다음 판부터 그 눈금으로 시작한다(영구) */
function upgradeDice(hid){
  const i = diceTierIdx(hid), nx = CFG.diceTiers[i + 1];
  if (!nx) return;
  if (G.meta.cur.crystal < nx.cost) return;
  G.meta.cur.crystal -= nx.cost;
  G.meta.dice[hid] = i + 1;
  save();
}

function weaponCard(x, y, w, h, wk, H){
  const W = CFG.weapons[wk], lv = G.meta.wlv[wk] || 1;
  const cost = wcost(wk), have = G.meta.cur[W.cur], can = have >= cost;

  ctx.fillStyle = '#8f9a92'; rr(x, y, w, h, 8); ctx.fill();
  ctx.fillStyle = H.card; rr(x + 4, y - 8, w - 8, 22, 5); ctx.fill();
  txtOut(W.name, x + w / 2, y + 3, 12, '#fff', 'center', 3);

  // 현재 피해 + 아이콘
  ctx.fillStyle = H.cardTop; rr(x + 5, y + 18, w - 10, h - 74, 6); ctx.fill();
  txtOut(String(wdmg(wk)), x + w / 2, y + 34, 20, '#fff', 'center', 4);
  icoWeapon(wk, x + w / 2, y + 62, 17);
  txt('LVL ' + lv, x + w / 2, y + h - 52, 10, '#fff', 'center');

  // 증가량
  txtOut('+' + W.dmgPerLv, x + w / 2, y + h - 34, 15, '#57ef4a', 'center', 3);

  // 비용
  ctx.fillStyle = can ? '#3ac13a' : '#b9c2c9';
  rr(x + 5, y + h - 24, w - 10, 20, 5); ctx.fill();
  icoCur(W.cur, x + w / 2 - 14, y + h - 14, 13);
  txtOut(String(cost), x + w / 2 + 6, y + h - 14, 13, can ? '#fff' : '#e26a5a', 'left', 3);

  if (can){
    HIT.push({ x:x, y:y, w:w, h:h, fn:(function(k){
      return function(){ levelWeapon(k); };
    })(wk) });
  }
}

function lockedWeaponCard(x, y, w, h){
  ctx.fillStyle = '#7d8781'; rr(x, y, w, h, 8); ctx.fill();
  ctx.fillStyle = '#5f6a64'; rr(x + 4, y - 8, w - 8, 22, 5); ctx.fill();
  txtOut('특별함', x + w / 2, y + 3, 12, '#d6ddd8', 'center', 3);
  ctx.fillStyle = '#96a09a'; rr(x + 5, y + 18, w - 10, h - 74, 6); ctx.fill();
  // 자물쇠
  const lx = x + w / 2, ly = y + 52;
  ctx.strokeStyle = '#e9eef2'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(lx, ly - 7, 9, Math.PI, TAU); ctx.stroke();
  ctx.fillStyle = '#e9eef2'; rr(lx - 13, ly - 7, 26, 20, 4); ctx.fill();
  ctx.fillStyle = '#7d8781'; ctx.fillRect(lx - 2, ly - 1, 4, 8);
  txt('준비 중', x + w / 2, y + h - 34, 12, '#e8eee9', 'center');
}

/* 무기 레벨업 — 재화를 쓴다. 피해가 바로 올라가고 영구히 남는다 */
function levelWeapon(wk){
  const W = CFG.weapons[wk], cost = wcost(wk);
  if (G.meta.cur[W.cur] < cost) return;
  G.meta.cur[W.cur] -= cost;
  G.meta.wlv[wk] = (G.meta.wlv[wk] || 1) + 1;
  save();
}

/* 홈 미리보기용 작은 적 */
function previewEnemy(x, y, r, big){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(20,26,16,0.22)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.8, r * 0.22, 0, 0, TAU); ctx.fill();
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#8fc255'); g.addColorStop(1, '#4e7033');
  ctx.fillStyle = g; ctx.strokeStyle = CFG.col.enemyLine; ctx.lineWidth = Math.max(1.4, r * 0.14);
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.15);
  ctx.bezierCurveTo(r * 0.95, -r * 0.7, r * 0.95, r * 0.85, 0, r * 0.85);
  ctx.bezierCurveTo(-r * 0.95, r * 0.85, -r * 0.95, -r * 0.7, 0, -r * 1.15);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#15190f';
  ctx.beginPath(); ctx.ellipse(-r * 0.28, -r * 0.1, r * 0.13, r * 0.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r * 0.28, -r * 0.1, r * 0.13, r * 0.2, 0, 0, TAU); ctx.fill();
  if (big){
    ctx.fillStyle = '#15190f';
    ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.26, r * 0.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e2564f';
    ctx.beginPath(); ctx.ellipse(0, r * 0.48, r * 0.12, r * 0.22, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawGameOver(){
  ctx.fillStyle = '#170f10'; ctx.fillRect(0, 0, L.w, L.h);
  const y = L.h * 0.28;
  txtOut('성벽이 무너졌다', L.w / 2, y, 28, '#ff8a8a', 'center', 6);
  txt('판 ' + G.lastStage + ' 실패', L.w / 2, y + 34, 15, '#e8eef8', 'center');
  txt('같은 판을 다시 도전할 수 있습니다', L.w / 2, y + 58, 11, '#8fa2c0', 'center');
  txt('재화와 무기 레벨은 남습니다', L.w / 2, y + 74, 11, '#8fa2c0', 'center');

  const bw = 210, bx = (L.w - bw) / 2;
  // 재도전 — 영웅을 다시 고르고 같은 판을 처음부터
  button(bx, y + 100, bw, 50, '판 ' + G.lastStage + ' 다시 도전',
         function(){ G.screen = 'pick'; }, '#3ac13a');
  // 영웅 탭에서 무기를 키우고 오는 길
  button(bx, y + 160, bw, 42, '영웅 강화하러 가기',
         function(){ G.screen = 'heroes'; }, '#3f79c8', 15);
  button(bx, y + 210, bw, 38, '홈으로',
         function(){ G.screen = 'main'; }, '#4a5568', 14);
}


/* ============================================================================
   입력
   ========================================================================== */
function onTap(x, y){
  for (let i = HIT.length - 1; i >= 0; i--){
    const b = HIT[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){ b.fn(); return; }
  }
  if (G.screen === 'reward') rewardTap();
}

cv.addEventListener('pointerdown', function(e){
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) * (cv.width  / Math.max(1, r.width));
  const py = (e.clientY - r.top)  * (cv.height / Math.max(1, r.height));
  onTap((px - S.ox) / S.s, (py - S.oy) / S.s);
}, { passive:true });

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);


/* ============================================================================
   루프
   ========================================================================== */
function update(dt){
  if (G.screen === 'battle') updBattle(dt);
  else if (G.screen === 'reward') updReward(dt);
  else if (G.screen === 'levelup' || G.screen === 'mimic'){ updParts(dt); updRoulette(dt); }

  G.saveT -= dt;
  if (G.saveT <= 0){ G.saveT = 1.0; if (G.saveDirty) save(); }
}

function draw(){
  HIT = [];
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#11150f';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.restore();
  ctx.setTransform(S.s, 0, 0, S.s, S.ox, S.oy);

  if (G.screen === 'main') drawMain();
  else if (G.screen === 'pick') drawPick();
  else if (G.screen === 'heroes') drawHeroes();
  else if (G.screen === 'spell') drawSpells();
  else if (G.screen === 'herodetail') drawHeroDetail();
  else if (G.screen === 'battle') drawBattle();
  else if (G.screen === 'levelup') drawLevelUp();
  else if (G.screen === 'mimic') drawMimicReward();
  else if (G.screen === 'reward') drawReward();
  else drawGameOver();
}

let last = 0;
function frame(ts){
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;          // 탭 전환 후 한꺼번에 진행되는 것 방지
  G.t += dt;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

load();
resize();
requestAnimationFrame(frame);
</script>
