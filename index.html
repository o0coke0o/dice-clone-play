}

const isBoss    = st => CFG.stage.bossAt.indexOf(st) >= 0;
function waveTotal(st){
  const W = CFG.wave;
  const n = W.normal + W.grow * Math.floor((st - 1) / W.growEvery)
            + (isBoss(st) ? W.bossAdd : 0);
  return Math.min(W.max, n);   // 상한은 보스 가산까지 더한 뒤에 적용한다
}
/* 일반 적이 나오는 웨이브 수. 보스판은 마지막 한 웨이브가 보스 차지다 */
function normalWaves(st){ return waveTotal(st) - (isBoss(st) ? 1 : 0); }
/* 지금이 보스 웨이브인가 */
function onBossWave(){ return isBoss(G.run.stage) && G.run.wave >= waveTotal(G.run.stage); }
const xpNeed    = lv => CFG.xp.start + CFG.xp.step * (lv - 1);
function wdmg(w){
  const W = CFG.weapons[w];
  const lv = (G.meta && G.meta.wlv[w]) || 1;
  // 2026-08-18: 피해 강화 스킬(물결·화염·속사·얼음)이 여기 하나로 걸린다.
  //   무기 레벨과 같은 성격(영구)이라 전투력 표시에도 자연히 반영된다.
  // ⚠ 반올림 필수. 스킬 배수(×1.12 등)를 곱하면 5.6000000000000005 같은 값이 나오고,
  //   그게 카드에 그대로 찍혀 숫자가 화면 밖으로 넘쳤다(2026-08-19 David 보고).
  //   피해는 원래 정수로만 다루므로 여기서 한 번 정리하면 표시·계산이 같이 맞는다.
  return Math.round((W.dmg + W.dmgPerLv * (lv - 1)) * skillMul(w, 'dmg'));
}

/* ---- 스킬 카드 ------------------------------------------------------------
   모은 카드의 효과 계산은 전부 이 네 함수를 지난다.
   전투 코드는 splashR(w) 처럼 '지금 값이 얼마냐'만 물어본다 — 그래야 카드가 늘어도
   전투 코드를 안 건드린다. */
function skillDef(id){
  for (const sk of CFG.skills.list) if (sk.id === id) return sk;
  return null;
}
/* ---- 장착 --------------------------------------------------------------
   2026-08-19 (David 지시): 모았다고 다 쓰는 게 아니라 '켜 둔 것'만 쓴다.
   켤 수 있는 개수는 그 영웅의 주사위 등급이 정한다(브론즈 1 → 다이아 6).
   ⚠ 효과 계산은 전부 skillOn() 을 거친다. 어딘가에서 skillLv() 를 그대로 쓰면
     꺼 둔 카드가 몰래 먹혀서 '칸이 모자란데 왜 효과가 나지?' 가 된다.
     반대로 주문서 화면은 skillLv() 를 쓴다 — 거긴 '가진 것'을 보여주는 곳이다. */
function equipList(hid){
  if (!G.meta.equip) G.meta.equip = {};
  if (!G.meta.equip[hid]) G.meta.equip[hid] = [];
  return G.meta.equip[hid];
}
function equipMax(hid){ return diceTier(hid).skills; }
function isEquipped(sk){
  if (!sk || !G.meta) return false;
  if (sk.hero) return equipList(sk.hero).indexOf(sk.id) >= 0;
  for (const h of CFG.heroOrder) if (equipList(h).indexOf(sk.id) >= 0) return true;
  return false;
}
/* 효과에 실제로 먹히는 레벨. 안 켰으면 0 */
function skillOn(sk){ return isEquipped(sk) ? skillLv(sk.id) : 0; }
/* 켜기/끄기. 칸이 다 찼으면 안 켜진다 */
function toggleEquip(hid, id){
  const sk = skillDef(id);
  if (!sk || skillLv(id) <= 0) return false;
  const list = equipList(hid), at = list.indexOf(id);
  if (at >= 0){ list.splice(at, 1); save(); return true; }
  if (list.length >= equipMax(hid)) return false;
  list.push(id); save(); return true;
}

/* 그 카드를 몇 레벨까지 모았나. 0 = 아직 못 얻었다 */
function skillLv(id){ return (G.meta && G.meta.skills && G.meta.skills[id]) || 0; }

/* 모아둔 카드가 그 무기의 그 값을 몇 배로 만드는가. 아무것도 없으면 1 배 그대로.
   같은 값을 키우는 카드가 여러 장이면 배수가 더해진다(1 + 0.3 + 0.2 …) */
/* 2026-08-18: effect.w 가 없는 카드(전체에 걸리는 perk)도 받는다.
   부를 때 w 에 null 을 넘기면 그런 카드만 모인다 — 무기 카드와 섞이지 않는다. */
function skillMul(w, stat){
  let mul = 1;
  const key = w || null;
  for (const sk of CFG.skills.list){
    if (sk.soon || !sk.effect) continue;
    if (sk.effect.stat !== stat) continue;
    if ((sk.effect.w || null) !== key) continue;
    mul += sk.effect.mulPerLv * skillOn(sk);
  }
  return mul;
}
/* 탄속 — 스킬로 빨라진 실제 값. 조준 예측과 실제 발사가 같은 값을 써야 빗나가지 않는다 */
function mSpeed(w){
  const M = CFG.missile[w];
  return (M ? M.speed : 0) * skillMul(w, 'speed');
}
/* 더해서 쌓이는 효과. 배수(skillMul)와 달리 '없으면 0'이다 —
   넉백처럼 '원래 없던 것이 카드로 생기는' 효과는 배수로는 표현이 안 된다(0 x 배수 = 0). */
function skillAdd(w, stat){
  let sum = 0;
  for (const sk of CFG.skills.list){
    if (sk.soon || !sk.effect) continue;
    if (sk.effect.w !== w || sk.effect.stat !== stat) continue;
    sum += (sk.effect.addPerLv || 0) * skillOn(sk);
  }
  return sum;
}

/* 영웅과 무기를 함께 보는 합산기.
   effect.w 가 없으면 그 영웅의 모든 무기에 걸린다(멀티샷·유도 화살이 그렇다). */
function skillAddFor(hid, w, stat){
  let sum = 0;
  for (const sk of CFG.skills.list){
    if (sk.soon || !sk.effect || sk.effect.stat !== stat) continue;
    if (sk.effect.w && sk.effect.w !== w) continue;
    if (sk.hero && hid && sk.hero !== hid) continue;
    sum += (sk.effect.addPerLv || 0) * skillOn(sk);
  }
  return sum;
}
/* 켜 둔 독 카드 중 제일 센 초당 피해. 합쳐지지 않는다 — 셋을 다 켜도 3 이다 */
function poisonDps(){
  let best = 0;
  for (const sk of CFG.skills.list){
    if (sk.soon || !sk.effect || sk.effect.stat !== 'poison') continue;
    if (skillOn(sk) > 0) best = Math.max(best, sk.effect.dps);
  }
  return best;
}
/* 독이 남아 있는 시간 */
function poisonTime(){
  return CFG.poison.base + skillAddFor(null, null, 'poiT');
}

/* 그 영웅의 세 번째 무기가 열렸나 */
function specialOn(hid){
  for (const sk of CFG.skills.list){
    if (sk.soon || !sk.effect) continue;
    if (sk.effect.stat === 'special' && sk.hero === hid) return skillOn(sk) > 0;
  }
  return false;
}

/* 폭발 반경 — 스킬로 넓어진 실제 값. 폭발이 없는 무기는 0 */
function splashR(w){
  const M = CFG.missile[w];
  if (!M || !M.splashR) return 0;
  return M.splashR * skillMul(w, 'splashR');
}
/* 카드 한 장 획득. 이미 있으면 레벨이 오른다. 상한이면 아무 일도 없다 */
/* 그 카드의 상한. 특별 무기를 여는 카드처럼 한 번이면 끝나는 것은 max:1 이다 */
function skillMax(sk){ return (sk && sk.max) || CFG.skills.maxLv; }
function gainSkill(id){
  const lv = skillLv(id), sk = skillDef(id);
  if (lv >= skillMax(sk)) return false;
  G.meta.skills[id] = lv + 1;
  // 빈 칸이 있으면 얻자마자 켠다 — 안 그러면 '카드를 얻었는데 아무 일도 안 난다'가 된다
  if (sk && sk.hero && !isEquipped(sk) && equipList(sk.hero).length < equipMax(sk.hero)){
    equipList(sk.hero).push(id);
  }
  save();
  return true;
}
/* 카드팩에 나올 수 있는 스킬 — 만들어 뒀고(soon 아님) 아직 상한이 아닌 것 */
function packableSkills(){
  const out = [];
  for (const sk of CFG.skills.list){
    if (sk.soon) continue;
    if (skillLv(sk.id) >= skillMax(sk)) continue;
    out.push(sk);
  }
  return out;
}
function rollInterval(hid){
  return Math.max(CFG.dice.minInterval, CFG.heroes[hid].interval * G.run.heroes[hid].cdMul);
}
function heroX(hid){ return L.cardX[hid] + L.cardW / 2; }
/* 뱀은 처음부터 있지 않다. 영웅 하나가 CFG.snakeAt 레벨에 닿으면 열린다(영구).
   ⚠ CFG.heroOrder 를 그대로 도는 자리(저장·자리 계산)는 잠긴 영웅도 같이 돌아야 한다 —
     저장 칸이 없으면 나중에 열렸을 때 들어갈 곳이 없다. 화면에 보이는 목록만 걸러낸다. */
function heroUnlocked(hid){
  if (hid !== 'snake') return true;
  return !!(G.meta && G.meta.snakeUnlocked);
}
function ownedHeroes(){ return CFG.heroOrder.filter(heroUnlocked); }
function unlockSnake(){
  if (!G.meta || G.meta.snakeUnlocked) return false;
  G.meta.snakeUnlocked = true;
  save();
  return true;
}

function liveHeroes(){
  const out = [];
  for (const hid of CFG.heroOrder) if (G.run.heroes[hid]) out.push(hid);
  return out;
}


/* ============================================================================
   세이브 / 로드
   면 구조가 옛 형식(숫자 배열)이면 감지해서 런을 버린다.
   ========================================================================== */
function facesOk(f, hid){
  if (!Array.isArray(f) || f.length !== CFG.heroes[hid].baseFaces.length) return false;
  for (let i = 0; i < f.length; i++){
    const x = f[i];
    if (!x || typeof x !== 'object') return false;             // 옛 구조: faces:[1,1,1,2,2,2]
    if (!CFG.weapons[x.w]) return false;
    if (typeof x.c !== 'number' || !isFinite(x.c) || x.c < 1) return false;
  }
  return true;
}
function normHero(src, hid){
  const h = newHero(hid);
  h.faces = src.faces.map(f => ({ w:f.w, c:Math.max(1, Math.round(f.c)) }));
  h.cdMul = (typeof src.cdMul === 'number' && src.cdMul > 0) ? Math.min(1, src.cdMul) : 1;
  h.level = Math.max(1, Math.floor(src.level || 1));
  h.xp    = Math.max(0, Math.floor(src.xp || 0));
  return h;
}

function save(){
  try {
    localStorage.setItem(CFG.save.key, JSON.stringify({
      ver:CFG.save.ver, meta:G.meta, run:G.run,
    }));
    G.saveDirty = false;
  } catch (e) { /* 저장 불가 환경은 무시하고 계속 진행 */ }
}
function markSave(){ G.saveDirty = true; }

function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(CFG.save.key) || 'null'); } catch (e) { d = null; }

  if (d && d.ver !== CFG.save.ver){ G.wiped = true; d = null; }

  G.meta = newMeta();
  if (d && d.meta){
    const m = d.meta;
    if (m.cur) for (const k of CFG.reward.order){
      if (typeof m.cur[k] === 'number' && isFinite(m.cur[k])) G.meta.cur[k] = m.cur[k];
    }
    if (m.wlv) for (const k in CFG.weapons){
      if (typeof m.wlv[k] === 'number' && m.wlv[k] >= 1) G.meta.wlv[k] = Math.floor(m.wlv[k]);
    }
    // 2026-08-18: 주사위 등급. 옛 저장본엔 없으므로 없으면 실버(0) 그대로 둔다.
    if (m.dice && typeof m.dice === 'object'){
      for (const h of CFG.heroOrder){
        const v = m.dice[h];
        if (typeof v === 'number' && v >= 0) G.meta.dice[h] = clamp(Math.floor(v), 0, CFG.diceTiers.length - 1);
      }
    }
    // 2026-08-19: 면마다 올려 둔 눈금. 옛 저장본엔 없으므로 없으면 0 으로 둔다
    if (m.faceUp && typeof m.faceUp === 'object'){
      for (const h of CFG.heroOrder){
        const src = m.faceUp[h];
        if (!Array.isArray(src)) continue;
        for (let i = 0; i < G.meta.faceUp[h].length; i++){
          const v = src[i];
          if (typeof v === 'number' && v >= 0) G.meta.faceUp[h][i] = clamp(Math.floor(v), 0, CFG.faceUp.max);
        }
      }
    }
    // 2026-08-18: 모은 스킬 카드. 옛 저장본엔 없으므로 없으면 빈 채로 둔다.
    // CFG.skills.list 에 없는 id 는 버린다 — 이름을 바꾼 옛 카드가 유령으로 남지 않게
    if (m.skills && typeof m.skills === 'object'){
      for (const sk of CFG.skills.list){
        const v = m.skills[sk.id];
        if (typeof v === 'number' && v >= 1) G.meta.skills[sk.id] = clamp(Math.floor(v), 1, skillMax(sk));
      }
    }
    // 켜 둔 스킬. 없는 카드·못 얻은 카드·칸을 넘긴 것은 버린다.
    // ⚠ 켠 목록 자체가 없는 옛 저장본은 '전부 꺼진 채'로 시작하게 된다 —
    //   그동안 모은 카드가 통째로 먹통이 되므로, 그때는 가진 것으로 칸을 채워 준다
    if (!m.equip){
      for (const h of CFG.heroOrder){
        const cap = diceTier(h).skills, got = [];
        for (const sk of CFG.skills.list){
          if (sk.soon || sk.hero !== h) continue;
          if (G.meta.skills[sk.id] > 0) got.push(sk.id);
          if (got.length >= cap) break;
        }
        G.meta.equip[h] = got;
      }
    }
    if (m.equip && typeof m.equip === 'object'){
      for (const h of CFG.heroOrder){
        const src = Array.isArray(m.equip[h]) ? m.equip[h] : [];
        const out = [];
        for (const id of src){
          const sk = skillDef(id);
          if (!sk || sk.soon) continue;
          if (!(G.meta.skills[id] > 0)) continue;
          if (out.indexOf(id) < 0) out.push(id);
        }
        G.meta.equip[h] = out.slice(0, diceTier(h).skills);
      }
    }
    if (m.snakeUnlocked) G.meta.snakeUnlocked = true;
    if (typeof m.bestStage === 'number') G.meta.bestStage = m.bestStage;
    if (typeof m.vibrate === 'boolean') G.meta.vibrate = m.vibrate;
  }

  G.run = newRun();
  if (d && d.run && !CFG.dev.freshOnLoad){
    const r = d.run;
    // 영웅별 구조가 아니거나 면 구조가 옛 형식이면 런만 버리고 재화는 남긴다
    let ok = !!r.heroes;
    if (ok) for (const hid of CFG.heroOrder){
      const h = r.heroes[hid];
      if (h && !facesOk(h.faces, hid)){ ok = false; break; }
    }
    if (ok){
      const n = G.run;
      n.started = !!r.started;
      n.stage   = clamp(Math.floor(r.stage || 1), 1, CFG.stage.perWorld);
      n.wave    = clamp(Math.floor(r.wave  || 1), 1, waveTotal(n.stage));
      n.wallHp  = clamp(Math.floor(r.wallHp), 1, CFG.wall.hp);
      if (!isFinite(n.wallHp) || n.wallHp <= 0) n.wallHp = CFG.wall.hp;
      for (const hid of CFG.heroOrder){
        n.heroes[hid] = r.heroes[hid] ? normHero(r.heroes[hid], hid) : null;
      }
      // 합류 순서 = 하단 슬롯 자리. 옛 저장본엔 없으므로 살아있는 영웅으로 채워 넣는다
      n.order = [];
      const src = Array.isArray(r.order) ? r.order : [];
      for (const hid of src) if (n.heroes[hid] && n.order.indexOf(hid) < 0) n.order.push(hid);
      for (const hid of CFG.heroOrder) if (n.heroes[hid] && n.order.indexOf(hid) < 0) n.order.push(hid);
    } else {
      G.wiped = true;
    }
  }
}


/* ============================================================================
   판 시작 / 웨이브
   ========================================================================== */
function startStage(){
  const r = G.run;
  if (!liveHeroes().length){ G.screen = 'pick'; return; }   // 영웅 없이 들어갈 수 없다
  G.enemies = []; G.bullets = []; G.parts = []; G.loot = []; G.rings = []; G.arcs = [];
  r.started = true;
  r.wave = clamp(r.wave, 1, waveTotal(r.stage));
  G.b = {
    phase:'wave',                     // wave | gap | cleanup | bosswarn | boss
    waveT:CFG.wave.limit, gapT:0, spawnQ:[],
    dice:{},                          // 영웅별 주사위 런타임
    warnT:0, warnLeft:0,
    boss:null, cards:null, lvHero:null,
    menu:null, mimicCard:null, mimicHero:null,
    rewardPhase:0, reward:null, chest:0,
    pack:null,                        // 판이 끝날 때 나오는 카드팩(victory 에서 만든다)
    roul:null,                        // 카드를 고른 뒤 값이 정해지는 룰렛
    // 미믹은 판당 한 마리. 어느 웨이브에 섞일지 판 시작 때 뽑는다
    mimicWave:rndi(1, Math.max(1, normalWaves(G.run.stage) - 1)), mimicDone:false,
  };
  for (const hid of liveHeroes()) G.b.dice[hid] = newDiceRt(hid);
  layout();
  G.screen = 'battle';
  beginWave();
  save();
}

function newDiceRt(hid){
  const t = CUBE_TARGET[0];
  return {
    rollT:CFG.heroes[hid].interval * 0.5, spinT:0, spinDur:CFG.dice.spin, face:0, pend:null,
    // 정육면체 자세. ax/ay 는 계속 누적되므로 굴릴 때마다 앞으로 돈다
    ax:t[0] + CFG.cube.tiltX, ay:t[1] + CFG.cube.tiltY,
    ax0:0, ay0:0, ax1:t[0] + CFG.cube.tiltX, ay1:t[1] + CFG.cube.tiltY,
    kick:0,                   // 발사 반동
  };
}

/* 다음 웨이브를 지금 출발시킨다 (2026-08-19 David 지시).
   ⚠ 여기서 직접 웨이브를 올리지 않는다 — 남은 시간을 0으로 만들어
     updWave 의 기존 종료 판정을 그대로 태운다. 규칙이 두 곳에 갈리면
     '남은 적은 사라지지 않는다' 같은 조건이 한쪽에서만 지켜진다. */
function forceNextWave(){
  const b = G.b;
  if (!b || G.screen !== 'battle' || b.menu) return false;
  if (b.phase === 'wave'){ b.waveT = 0; return true; }
  if (b.phase === 'gap'){  b.gapT  = 0; return true; }
  return false;                      // 정리 중·보스 경고·보스전에는 안 먹는다
}

function beginWave(){
  const r = G.run, b = G.b;
  b.phase = 'wave';
  b.waveT = CFG.wave.limit;
  const E = CFG.enemy;
  const full = Math.min(E.perWaveMax, E.perWave + E.perWaveAdd * (r.stage - 1));
  const total = normalWaves(r.stage);
  const prog = total > 1 ? clamp((r.wave - 1) / (total - 1), 0, 1) : 1;
  const n = Math.max(2, Math.round(full * (E.rampStart + (1 - E.rampStart) * prog)));
  for (let i = 0; i < n; i++) b.spawnQ.push({ t:i * CFG.wave.spawnGap, wave:r.wave });
  // 이 웨이브가 미믹 차례면 무작위 위치에 한 마리 끼워 넣는다
  if (!b.mimicDone && r.wave === b.mimicWave){
    b.mimicDone = true;
    b.spawnQ.push({ t:rnd(0.3, Math.max(0.6, n * CFG.wave.spawnGap)), wave:r.wave, mimic:true });
  }
}

function enemyStats(stage){
  const E = CFG.enemy, k = stage - 1;
  return {
    hp:    Math.round(E.hp * Math.pow(E.hpGrow, k)),
    speed: E.speed * Math.pow(E.speedGrow, k),
  };
}

/* 이 판에서 어떤 종류가 나올지 뽑는다. 큰 놈 비율만 판별로 올리고
   남은 몫을 작은/중간이 원래 weight 비율대로 나눠 갖는다 */
function pickKind(stage, wave){
  const B = CFG.bigRate, M = CFG.mix;
  // 판 안에서의 진행도 0(첫 웨이브) → 1(마지막 일반 웨이브)
  const total = normalWaves(stage);
  const prog = total > 1 ? clamp((wave - 1) / (total - 1), 0, 1) : 1;

  // 큰 놈 — 처음 세 웨이브에는 안 나오고, 뒤로 갈수록 확률이 오른다
  if (wave >= B.fromWave){
    const bigP = Math.min(B.max, B.base + B.perStage * (stage - 1)) * prog;
    if (Math.random() < bigP) return 'big';
  }
  // 작은 놈 비중은 첫 웨이브 90% → 마지막 22% 로 줄어든다(그만큼 중간 놈이 늘어난다)
  const smallP = M.smallStart + (M.smallEnd - M.smallStart) * prog;
  return Math.random() < smallP ? 'small' : 'grunt';
}

function spawnEnemy(wave){
  const st = G.run.stage, s = enemyStats(st);
  const kind = pickKind(st, wave);
  const T = CFG.etypes[kind];
  const r  = CFG.enemy.r * T.rMul;
  const hp = Math.max(1, Math.round(s.hp * T.hpMul));
  G.enemies.push({
    x:rnd(r + 10, L.w - r - 10), y:-r - rnd(0, 70), r:r,
    hp:hp, hpMax:hp, inc:0,
    sp:s.speed * T.spMul * rnd(0.9, 1.1), dmg:T.wallDmg, hitGap:T.hitGap,
    kind:kind, xpMul:T.xpMul,
    wave:wave, boss:false, atk:0, wob:rnd(0, TAU), flash:0, dead:false,
  });
}

function spawnMimic(wave){
  const s = enemyStats(G.run.stage), M = CFG.mimic;
  const r  = CFG.enemy.r * M.rMul;
  const hp = Math.max(1, Math.round(s.hp * M.hpMul));
  G.enemies.push({
    x:rnd(r + 12, L.w - r - 12), y:-r - rnd(0, 40), r:r,
    hp:hp, hpMax:hp, inc:0,
    sp:s.speed * M.spMul, dmg:M.wallDmg, hitGap:M.hitGap,
    kind:'mimic', xpMul:M.xpMul,
    wave:wave, boss:false, atk:0, wob:rnd(0, TAU), flash:0, dead:false,
  });
}

function spawnBoss(){
  const st = G.run.stage, s = enemyStats(st), B = CFG.boss;
  let mul = B.hpMul;
  if (B.bigAt.indexOf(st) >= 0) mul *= B.bigMul;
  const r  = CFG.enemy.r * B.rMul;
  const hp = Math.round(s.hp * mul);
  const e = {
    x:L.w / 2, y:-r - 20, r:r,
    hp:hp, hpMax:hp, inc:0,
    sp:s.speed * B.speedMul, dmg:B.wallDmg, hitGap:B.hitGap,
    kind:'boss', xpMul:B.xpMul,
    wave:-1, boss:true, atk:0, wob:0, flash:0, dead:false,
  };
  G.enemies.push(e);
  G.b.boss = e;
}


/* ============================================================================
   전투 업데이트
   ========================================================================== */
function updBattle(dt){
  const r = G.run, b = G.b;
  if (b.menu) return;                        // 설정 열려 있으면 전투 정지

  for (let i = b.spawnQ.length - 1; i >= 0; i--){
    const q = b.spawnQ[i];
    q.t -= dt;
    if (q.t <= 0){
      if (q.mimic) spawnMimic(q.wave); else spawnEnemy(q.wave);
      b.spawnQ.splice(i, 1);
    }
  }

  updDice(dt);
  updBullets(dt);
  updEnemies(dt);
  updParts(dt);

  // 위 처리 중에 레벨업 3택이 열리거나 성벽이 무너졌으면 여기서 멈춘다.
  // (보스를 죽인 프레임에 레벨업이 열리면 승리가 그것을 덮어써 카드가 사라진다)
  if (G.screen !== 'battle') return;

  if (b.phase === 'wave'){
    b.waveT -= dt;
    let pending = false, alive = false;
    for (const q of b.spawnQ) if (q.wave === r.wave){ pending = true; break; }
    for (const e of G.enemies) if (e.wave === r.wave){ alive = true; break; }
    // 종료 조건: A 그 웨이브 전멸  B 제한 시간 경과
    // B로 넘어가도 남은 적은 사라지지 않는다(스폰 큐도 그대로 두어 계속 나온다)
    if ((!pending && !alive) || b.waveT <= 0){
      if (r.wave < normalWaves(r.stage)){
        r.wave++; b.phase = 'gap'; b.gapT = CFG.wave.gap; markSave();
      } else {
        // 일반 웨이브 끝. 보스판이면 마지막 웨이브 번호를 보스에게 넘긴다
        if (isBoss(r.stage)) r.wave = waveTotal(r.stage);
        b.phase = 'cleanup'; markSave();
      }
    }
  } else if (b.phase === 'gap'){
    b.gapT -= dt;
    if (b.gapT <= 0) beginWave();
  } else if (b.phase === 'cleanup'){
    if (b.spawnQ.length === 0 && G.enemies.length === 0){
      if (isBoss(r.stage)){
        b.phase = 'bosswarn'; b.warnLeft = CFG.boss.warnFlash; b.warnT = CFG.boss.warnGap;
      } else victory();
    }
  } else if (b.phase === 'bosswarn'){
    b.warnT -= dt;
    if (b.warnT <= 0){
      b.warnLeft--; b.warnT = CFG.boss.warnGap;
      if (b.warnLeft <= 0){ b.phase = 'boss'; spawnBoss(); }
    }
  } else if (b.phase === 'boss'){
    if (b.boss && b.boss.dead) victory();
  }
}

/* ---- 주사위 굴림 ---------------------------------------------------------- */
function updDice(dt){
  for (const hid of liveHeroes()){
    if (G.b.dice[hid]) updHeroDice(hid, dt);
  }
}

function updHeroDice(hid, dt){
  const d = G.b.dice[hid];
  if (d.kick > 0){ d.kick = Math.max(0, d.kick - dt * 7); }
  if (d.spinT > 0){
    d.spinT -= dt;
    if (d.spinT < 0) d.spinT = 0;
    // 굴러가는 동안 자세를 보간한다. 끝에서 감속(ease-out)
    const p = 1 - d.spinT / d.spinDur;
    const e = 1 - Math.pow(1 - clamp(p, 0, 1), 2.2);
    d.ax = d.ax0 + (d.ax1 - d.ax0) * e;
    d.ay = d.ay0 + (d.ay1 - d.ay0) * e;
  }

  if (d.pend){
    d.pend.t -= dt;
    while (d.pend && d.pend.t <= 0 && d.pend.left > 0){
      if (!fireOne(hid, d.pend.w, d.pend.chain)){ d.pend = null; break; }   // 적이 없으면 남은 발사는 취소
      d.pend.left--;
      if (d.pend.left <= 0){ d.pend = null; break; }
      d.pend.t += CFG.dice.shotGap;
    }
  }

  d.rollT -= dt;
  if (d.rollT <= 0){
    // 사거리 안에 적이 없으면 굴리지 않고 다 찬 상태로 기다린다
    if (!acquire()){ d.rollT = 0; return; }
    const iv = rollInterval(hid);
    d.rollT += iv;
    if (d.rollT <= 0) d.rollT = iv;
    doRoll(hid);
  }
}

function doRoll(hid){
  const d = G.b.dice[hid], h = G.run.heroes[hid], C = CFG.cube;
  d.face  = rndi(0, h.faces.length - 1);
  // 연출 길이는 굴림 주기에 맞춰 줄인다(주기가 짧으면 그만큼 빠르게 굴러 착지)
  d.spinDur = Math.min(CFG.dice.spin, rollInterval(hid) * CFG.dice.spinMaxFrac);
  d.spinT = d.spinDur;

  // 정육면체가 굴러서 나온 면이 카메라를 보게 만든다.
  // 현재 자세에서 최소 한 바퀴 이상 더 돌아 도착하도록 상대 각도로 잡는다.
  const t = CUBE_TARGET[d.face];
  d.ax0 = d.ax; d.ay0 = d.ay;
  d.ax1 = d.ax0 + TAU * rndi(C.turnMin, C.turnMax) + angTo(d.ax0, t[0] + C.tiltX);
  d.ay1 = d.ay0 + TAU * rndi(C.turnMin, C.turnMax) + angTo(d.ay0, t[1] + C.tiltY);

  const f = h.faces[d.face];
  const pips = Math.max(1, Math.round(f.c));
  const M = CFG.missile[f.w];
  // 나온 면의 무기로, 그 면의 발사 수만큼 쏜다. 착지하는 순간 발사한다.
  // 전기샷(oneShot)만 예외다 — 눈금이 발사 수가 아니라 '번지는 수'가 된다.
  //   눈금 3 이면 한 발이 나가서 맞은 놈 + 2 명 = 3 명에게 들어간다(David 지정)
  d.pend = (M && M.oneShot)
    ? { w:f.w, left:1,    t:d.spinDur, chain:pips - 1 }
    : { w:f.w, left:pips, t:d.spinDur, chain:0 };
}

/* a 에서 b 까지 앞으로 도는 최소 각(0 이상 TAU 미만) */
function angTo(a, b){
  let d = (b - a) % TAU;
  if (d < 0) d += TAU;
  return d;
}

/* 조준 규칙
   1) 성벽에 붙은 적이 있으면 그중 '먼저 도착한 순서'로 친다.
      다 같은 줄에 서기 때문에 화면상 위치로는 순서를 가릴 수 없다(크기 때문에 y 가 조금씩 다를 뿐).
   2) 붙은 적이 없으면 성벽에 가장 가까운(= y 가 큰) 적을 친다.
   오버킬 방지: 이미 예약된 피해(inc)로 죽을 적은 후보에서 빼되, 그런 적밖에 없으면 그거라도 친다.
   아직 화면 위(사거리 밖)에 있는 적은 조준하지 않는다 */
function acquire(){
  let wBest = null, wBestSeq = Infinity, wAny = null, wAnySeq = Infinity;
  let best = null, bestY = -1e9, any = null, anyY = -1e9;
  for (const e of G.enemies){
    if (e.dead) continue;
    if (e.y + e.r < CFG.aim.minY) continue;
    const free = e.hp - e.inc > 0;
    if (e.atWall !== undefined){
      if (e.atWall < wAnySeq){ wAny = e; wAnySeq = e.atWall; }
      if (free && e.atWall < wBestSeq){ wBest = e; wBestSeq = e.atWall; }
    } else {
      if (e.y > anyY){ any = e; anyY = e.y; }
      if (free && e.y > bestY){ best = e; bestY = e.y; }
    }
  }
  return wBest || best || wAny || any;
}

function fireOne(hid, w, chain){
  const t = acquire();
  if (!t) return false;
  const M = CFG.missile[w];
  const dmg = wdmg(w);                    // 발당 피해는 무기 종류가 결정한다
  const ox = heroX(hid), oy = L.wallY - 6;
  // '유도 화살' 카드를 얻으면 곧게 날던 화살도 적을 쫓는다.
  // 유도 여부는 무기가 아니라 탄 하나하나에 실린다(b.homing) — 카드를 얻고 잃어도 날던 탄은 그대로
  const homing = !!M.homing || skillAddFor(hid, w, 'homing') > 0;
  const sp = homing ? CFG.missile.spread : CFG.missile.spreadStraight;

  let aimX = t.x, aimY = t.y;
  if (!homing){
    // 직선탄은 목표가 내려올 위치를 예측해 조준한다. 현재 위치를 쏘면 자꾸 빗나간다
    const tt = Math.hypot(t.x - ox, t.y - oy) / mSpeed(w);   // 2026-08-18: 예측도 스킬 반영된 탄속으로
    aimY = t.y + t.sp * tt;
  }
  const base = Math.atan2(aimY - oy, aimX - ox);

  // 멀티샷 — 레벨당 한 발씩 늘어나고 부채꼴로 벌어진다
  const n = 1 + Math.round(skillAddFor(hid, null, 'multi'));
  let a = base;
  for (let i = 0; i < n; i++){
    const off = (n === 1) ? 0 : (i - (n - 1) / 2) * CFG.missile.fan;
    a = base + off + rnd(-sp, sp);
    t.inc += dmg;                         // 예약(탄 하나마다)
    G.bullets.push({
      w:w, hid:hid, x:ox, y:oy, a:a, sp:mSpeed(w), r:M.r, dmg:dmg, t:M.life,
      tgt:t, ph:rnd(0, TAU), trail:[],
      homing:homing,
      chain:chain || 0,                   // 전기샷이 번질 남은 횟수
      hitIds:M.pierce ? [] : null,        // 관통탄이 이미 맞힌 적(같은 적을 두 번 안 때리게)
    });
  }

  // 손맛 — 한 발마다 짧은 진동 + 발사 섬광 + 주사위 반동
  buzz();
  const d = G.b.dice[hid];
  if (d) d.kick = 1;
  const W = CFG.weapons[w];
  for (let k = 0; k < 3; k++){
    G.parts.push({ x:ox + rnd(-3, 3), y:oy + rnd(-2, 2),
                   vx:Math.cos(a) * rnd(30, 90), vy:Math.sin(a) * rnd(30, 90),
                   t:0.14, life:0.14, c:k ? W.col : '#fff', r:rnd(1.4, 2.6) });
  }
  return true;
}

function updBullets(dt){
  for (let i = G.bullets.length - 1; i >= 0; i--){
    const b = G.bullets[i], M = CFG.missile[b.w];
    b.t -= dt;

    let t = b.tgt;
    // 죽었거나 목록에서 빠진 목표는 없는 것으로 본다
    if (t && (t.dead || t.hp <= 0 || G.enemies.indexOf(t) < 0)){
      t.inc -= b.dmg;
      if (b.homing){                     // 유도탄은 다음 목표로 예약을 옮긴다
        t = acquire();
        b.tgt = t;
        if (t) t.inc += b.dmg;
      } else {
        t = null; b.tgt = null;           // 직선탄은 그대로 날아간다
      }
    }
    // 쫓을 적이 아예 없는 유도탄은 곧 사라진다(화면 구석에 박혀 남지 않게)
    if (b.homing && !t && b.t > CFG.missile.orphanLife) b.t = CFG.missile.orphanLife;

    if (b.homing && t){
      b.a = angLerp(b.a, Math.atan2(t.y - b.y, t.x - b.x), Math.min(1, M.turn * dt));
    }

    b.trail.push(b.x, b.y);
    if (b.trail.length > 12) b.trail.splice(0, b.trail.length - 12);
    b.x += Math.cos(b.a) * b.sp * dt;
    b.y += Math.sin(b.a) * b.sp * dt;

    // 명중 판정 — 지나가는 길에 닿은 적을 맞힌다(직선탄은 예약 대상이 아닌 적도 맞을 수 있다)
    let hit = null;
    for (const e of G.enemies){
      if (e.dead) continue;
      if (b.hitIds && b.hitIds.indexOf(e) >= 0) continue;   // 관통탄이 이미 뚫은 적
      const dx = e.x - b.x, dy = e.y - b.y, rr2 = (e.r + b.r) * (e.r + b.r);
      if (dx * dx + dy * dy <= rr2){ hit = e; break; }
    }
    if (hit){
      if (b.tgt) b.tgt.inc -= b.dmg;     // 예약 해제(맞은 적과 다를 수 있다)
      hitEnemy(hit, b.dmg, b.hid, b.w);

      // 전기 — 맞은 놈에서 주변으로 번져나간다. 눈금 3 이면 여기서 2 명 더 맞는다
      if (b.chain > 0) chainBolt(hit, b);

      // 관통 — 뚫고 지나간다. 사라지지도, 다시 같은 적을 때리지도 않는다
      if (b.hitIds){
        b.hitIds.push(hit);
        b.tgt = null;                    // 예약은 이미 풀었다. 앞으로 만나는 적을 그냥 맞힌다
        boom(b.x, b.y, b.w);
        continue;
      }
      const sr = splashR(b.w);      // 스킬 '폭발 확장'으로 넓어진 실제 반경(없으면 기본값)
      if (sr){
        // 화염 — 맞은 적의 중심을 기준으로 주변에 폭발 피해.
        // 탄 위치(적의 표면)에서 재면 붙어 있는 적조차 반경 밖으로 나가 아무도 안 맞는다
        const sd = Math.max(1, Math.round(b.dmg * M.splashMul));
        const R2 = sr * sr;
        for (const e of G.enemies){
          if (e === hit || e.dead) continue;
          const dx = e.x - hit.x, dy = e.y - hit.y;
          if (dx * dx + dy * dy <= R2) hitEnemy(e, sd, b.hid, b.w);
        }
        G.rings.push({ x:hit.x, y:hit.y, r:sr, t:0.26, life:0.26, c:CFG.weapons[b.w].col });
      }
      boom(b.x, b.y, b.w);
      G.bullets.splice(i, 1);
      continue;
    }

    if (b.homing && t){
      // 쫓을 목표가 있을 때만 화면 안에 붙여둔다. 지나쳐도 선회해서 되돌아온다.
      // 목표가 없는데 붙여두면 화면 구석에 박혀 영원히 남는다(그 버그로 코너에 걸렸다)
      b.x = clamp(b.x, 4, L.w - 4);
      b.y = clamp(b.y, 4, L.wallY - 2);
      if (b.t <= 0){
        if (b.tgt) b.tgt.inc -= b.dmg;
        G.bullets.splice(i, 1);
      }
    } else if (b.t <= 0 || b.y < -60 || b.y > L.h + 60 || b.x < -60 || b.x > L.w + 60){
      // 목표가 없는 유도탄과 빗나간 직선탄은 그대로 날아가 사라진다
      if (b.tgt) b.tgt.inc -= b.dmg;
      G.bullets.splice(i, 1);
    }
  }
}

/* 전기 연쇄 — 맞은 적에서 가까운 순으로 번져나간다.
   번지는 수는 주사위 눈금이 정한다(눈금 3 → 맞은 놈 + 2 명).
   ⚠ 번진 피해는 chainMul 만큼 줄인다. 그대로 다 들어가면 눈금 5 짜리 한 방이 웨이브를 지운다. */
function chainBolt(from, b){
  const M = CFG.missile[b.w];
  const R2 = M.chainR * M.chainR;
  const dmg = Math.max(1, Math.round(b.dmg * M.chainMul));
  const done = [from];
  let cur = from, left = b.chain;
  while (left > 0){
    let next = null, bestD = Infinity;
    for (const e of G.enemies){
      if (e.dead || done.indexOf(e) >= 0) continue;
      const dx = e.x - cur.x, dy = e.y - cur.y, d2 = dx * dx + dy * dy;
      if (d2 <= R2 && d2 < bestD){ bestD = d2; next = e; }
    }
    if (!next) break;                     // 닿는 곳에 아무도 없으면 거기서 끝난다
    G.arcs.push({ x1:cur.x, y1:cur.y, x2:next.x, y2:next.y, t:0.20, life:0.20 });
    hitEnemy(next, dmg, b.hid, b.w);
    done.push(next); cur = next; left--;
  }
}

function hitEnemy(e, dmg, hid, w){
  e.hp -= dmg;
  e.flash = 0.12;
  if (w === 'ice') e.slowT = CFG.ice.slowT * skillMul('ice', 'slowT');   // 얼음 화살 — 잠깐 느려진다('서리 지속'이 늘린다)
  // 독 — 뱀 무기(poison:true)에 맞으면 오른다. 이미 걸려 있으면 센 쪽으로 갱신하고 시간을 채운다
  const W2 = CFG.weapons[w];
  if (W2 && W2.poison){
    const dps = poisonDps();
    if (dps > 0){
      e.poi   = Math.max(e.poi || 0, dps);
      e.poiT  = poisonTime();
      e.poiBy = hid;                  // 독으로 죽으면 이 영웅이 경험치를 받는다
      if (e.poiTick === undefined) e.poiTick = CFG.poison.tick;
    }
  }
  // 넉백 — 카드를 얻어야 생기는 효과다. 레벨당 CFG.knock.px 만큼 뒤로 민다
  const kb = skillAdd(w, 'knock');
  if (kb > 0 && e.hp > 0){
    const top = L.hud + 24;                       // 화면 위(사거리 밖)까지 밀어내지는 않는다
    e.y = Math.max(top, e.y - kb * CFG.knock.px);
    if (e.y < L.wallY - e.r) e.atk = 0.001;       // 성벽에서 떨어졌으니 때리는 박자를 끊는다
  }
  if (e.hp <= 0){ e.hp = 0; killEnemy(e, hid); }
}

function killEnemy(e, hid){
  e.dead = true;
  const n = e.boss ? 26 : 9;
  for (let i = 0; i < n; i++){
    G.parts.push({ x:e.x, y:e.y, vx:rnd(-100, 100), vy:rnd(-130, 40),
                   t:0.5, life:0.5, c:e.boss ? '#ffd166' : CFG.col.enemy, r:rnd(1.4, 3) });
  }
  // 미믹은 잡으면 3택 없이 무작위 업그레이드 1개를 바로 준다
  if (e.kind === 'mimic') mimicReward(hid);

  // 경험치는 그 적을 죽인 탄의 영웅에게만 들어간다(영웅별 전용 경험치).
  // 큰 놈과 보스는 그만큼 더 준다. 미믹은 xpMul 0 이라 경험치가 없다
  const xm = (e.xpMul === undefined) ? 1 : e.xpMul;
  if (xm > 0) gainXp(hid, CFG.enemy.xp * xm);
}

/* 업그레이드 카드 한 장 만들기. 레벨업 3택과 미믹이 같이 쓴다 —
   카드 모양이 두 곳에 갈리면 한쪽만 룰렛을 안 타는 사고가 난다 */
function newUpCard(p, h, ally){
  const c = { id:p.id, kind:p.kind || (p.ally ? 'ally' : ''), name:p.name, foot:p.foot,
              roll:p.roll || null, hero:p.ally ? (ally || null) : null, targets:[] };
  if (p.ally && ally) c.name = CFG.heroes[ally].name + ' 합류';
  if (p.faces && h){
    // 대상 면을 카드 만들 때 정해둔다 → 카드에 대상 무기 색과 현재값을 그릴 수 있다
    const idx = [];
    for (let j = 0; j < h.faces.length; j++) idx.push(j);
    c.targets = shuffle(idx).slice(0, p.faces);
  }
  return c;
}

/* 범위 안에서 값 하나 뽑기. step 이 5 면 15·20·25 처럼 띄엄띄엄 나온다 */
function rollValue(r){
  const steps = Math.floor((r.max - r.min) / r.step) + 1;
  return r.min + r.step * Math.floor(Math.random() * steps);
}

/* 룰렛 시작 — 값은 여기서 이미 정해지고, 화면은 그 값으로 멈추는 연출만 한다.
   먼저 정해두는 이유: 중간에 화면이 바뀌거나 탭으로 건너뛰어도 결과가 흔들리지 않는다 */
function startRoulette(c, mode){
  const n = Math.max(1, c.targets.length);
  const vals = [];
  for (let i = 0; i < n; i++) vals.push(rollValue(c.roll));
  return { card:c, mode:mode, vals:vals, t:0, applied:false };
}

/* 정해진 값을 실제로 먹인다. 레벨·화면 정리는 부르는 쪽 몫이다 */
function applyUpCard(c, vals, h){
  if (c.hero && !G.run.heroes[c.hero]){
    addHero(G.run, c.hero);            // 자리·주사위·layout 을 addHero 가 한꺼번에 한다
    return;
  }
  if (!h) return;
  if (c.targets.length && vals){
    for (let i = 0; i < c.targets.length; i++) h.faces[c.targets[i]].c += vals[i];
  } else if (c.kind === 'cd' && vals){
    h.cdMul *= (1 - vals[0] / 100);    // 15 → 15% 감소
  }
}

function updRoulette(dt){
  const b = G.b, R = b && b.roul;
  if (!R || R.applied) return;
  const U = CFG.up.roulette;
  R.t += dt;
  if (R.t >= U.spin + U.hold) applyRoulette();
}

function applyRoulette(){
  const b = G.b, R = b && b.roul;
  if (!R || R.applied) return;
  R.applied = true;
  const hid = R.mode === 'mimic' ? b.mimicHero : b.lvHero;
  const h = G.run.heroes[hid];
  applyUpCard(R.card, R.vals, h);
  if (R.mode === 'mimic'){
    b.mimicCard = null; b.mimicHero = null;
  } else if (h){
    h.xp = Math.max(0, h.xp - xpNeed(h.level));
    h.level++;
    if (h.level >= CFG.snakeAt) unlockSnake();   // 뱀이 열린다(한 번만)
    b.cards = null; b.lvHero = null;
  }
  b.roul = null;
  save();
  G.screen = 'battle';
  checkLevelUp();                      // 연속 레벨업(다른 영웅 포함)
}

/* 미믹 보상 — 무작위 업그레이드 1개를 카드로 보여준다. 확인을 누르면 적용된다 */
function mimicReward(hid){
  const h = G.run.heroes[hid];
  if (!h) return;
  const pool = CFG.up.pool.filter(p => !p.hero);      // 영웅 배치 카드는 제외
  const p = pickOne(pool);
  const c = newUpCard(p, h, null);
  G.b.mimicHero = hid;
  G.b.mimicCard = c;
  G.screen = 'mimic';
}

/* 미믹 카드 확인 — 레벨업 없이 효과만 적용한다 */
function takeMimicCard(){
  const c = G.b.mimicCard;
  if (!c) return;
  if (!c.roll){ G.b.roul = { card:c, mode:'mimic', vals:null, t:0, applied:false }; applyRoulette(); return; }
  G.b.roul = startRoulette(c, 'mimic');   // 미믹도 같은 룰렛을 탄다
}

/* 레벨업/미믹 카드가 어느 영웅 것인지 */
function cardHero(){
  return (G.b && (G.b.lvHero || G.b.mimicHero)) || 'mage';
}

function updEnemies(dt){
  for (const e of G.enemies){
    if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.slowT > 0) e.slowT -= dt;                    // 얼음 화살 슬로우
    // 독 — 시간을 두고 깎인다. 매 프레임이 아니라 tick 마다 정수로 깎아야 숫자가 깔끔하다
    if (e.poiT > 0){
      e.poiT -= dt;
      e.poiTick -= dt;
      if (e.poiTick <= 0){
        e.poiTick += CFG.poison.tick;
        const d = Math.max(1, Math.round(e.poi * CFG.poison.tick));
        e.hp -= d;
        if (e.hp <= 0){ e.hp = 0; killEnemy(e, e.poiBy || 'snake'); continue; }
      }
      if (e.poiT <= 0){ e.poi = 0; }
    }
    e.wob += dt * 2.2;
    const spd = e.sp * (e.slowT > 0 ? CFG.ice.slowMul : 1);
    const stopY = L.wallY - e.r;
    if (e.y < stopY){
      e.y += spd * dt;
      if (e.y > stopY) e.y = stopY;
      e.x = clamp(e.x + Math.sin(e.wob) * 7 * dt, e.r + 4, L.w - e.r - 4);
    } else {
      // 성벽에 닿으면 멈추고 죽을 때까지 계속 때린다
      e.y = stopY;
      if (e.atWall === undefined) e.atWall = ++G.arriveSeq;   // 도착 순번(먼저 온 놈이 작다)
      e.atk -= dt;
      if (e.atk <= 0){ e.atk = e.hitGap || 1.4; hitWall(e); }
    }
  }
  for (let i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].dead) G.enemies.splice(i, 1);
}

function hitWall(e){
  if (G.screen !== 'battle') return;   // 같은 프레임에 이미 게임오버 → 새 런의 성벽을 깎지 않도록
  const r = G.run;
  r.wallHp -= e.dmg;
  // 화면 흔들림은 넣지 않는다(어지럽다는 지적). 성벽 파편으로만 피격을 알린다
  for (let i = 0; i < 6; i++){
    G.parts.push({ x:e.x, y:L.wallY + 2, vx:rnd(-50, 50), vy:rnd(-90, -10),
                   t:0.4, life:0.4, c:'#ff6b6b', r:rnd(1.2, 2.4) });
  }
  markSave();
  if (r.wallHp <= 0){ r.wallHp = 0; gameOver(); }
}

function boom(x, y, w){
  const W = CFG.weapons[w], n = w === 'strong' ? 11 : 5;
  for (let i = 0; i < n; i++){
    G.parts.push({ x:x, y:y, vx:rnd(-80, 80), vy:rnd(-80, 80),
                   t:0.26, life:0.26, c:i % 2 ? W.col : W.col2, r:rnd(1.2, 2.8) });
  }
}

function updParts(dt){
  for (let i = G.arcs.length - 1; i >= 0; i--){
    G.arcs[i].t -= dt;
    if (G.arcs[i].t <= 0) G.arcs.splice(i, 1);
  }
  for (let i = G.rings.length - 1; i >= 0; i--){
    G.rings[i].t -= dt;
    if (G.rings[i].t <= 0) G.rings.splice(i, 1);
  }
  for (let i = G.parts.length - 1; i >= 0; i--){
    const p = G.parts[i];
    p.t -= dt;
    if (p.t <= 0){ G.parts.splice(i, 1); continue; }
    p.vy += 240 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}


/* ============================================================================
   XP / 레벨업 3택
   ========================================================================== */
function gainXp(hid, n){
  n *= skillMul(null, 'xpGain');   // 2026-08-18: '수련' perk — 두 영웅 모두에 걸린다
  const h = G.run.heroes[hid];
  if (!h) return;
  h.xp += n;
  markSave();
  if (G.screen === 'battle') checkLevelUp();
}

/* 이 판이 사실상 끝났는가 — 남은 적도, 나올 적도 없다.
   보스판은 마지막 웨이브 뒤에 보스가 오므로 보스를 잡기 전까지는 끝난 게 아니다 */
function stageEnding(){
  const r = G.run, b = G.b;
  if (!b) return false;
  if (r.wave < waveTotal(r.stage)) return false;
  if (b.spawnQ.length) return false;
  for (const e of G.enemies) if (!e.dead) return false;
  if (isBoss(r.stage) && !(b.boss && b.boss.dead)) return false;   // 보스가 아직 남았다
  return true;
}

/* 영웅마다 자기 경험치로 따로 레벨업한다. 동시에 찼으면 순서대로 한 번씩 띄운다.
   단 판의 마지막 적을 잡아 판이 끝나는 순간이면 업그레이드가 의미 없으니 띄우지 않는다 */
function checkLevelUp(){
  if (stageEnding()) return false;
  for (const hid of liveHeroes()){
    const h = G.run.heroes[hid];
    if (h.xp >= xpNeed(h.level)){ openLevelUp(hid); return true; }
  }
  return false;
}

function openLevelUp(hid){
  G.b.lvHero = hid;
  G.b.cards  = makeCards(hid);
  G.screen   = 'levelup';
}

/* 아직 전장에 안 나온 영웅(있으면) */
function missingHero(){
  for (const hid of ownedHeroes()) if (!G.run.heroes[hid]) return hid;
  return null;
}

function makeCards(hid){
  const h = G.run.heroes[hid];
  const ally = missingHero();
  const pool = shuffle(CFG.up.pool.filter(p => !p.ally || ally));
  const out = [];
  for (let i = 0; i < Math.min(CFG.up.pick, pool.length); i++){
    out.push(newUpCard(pool[i], h, ally));
  }
  return out;
}


/* 카드를 골랐다. 값이 범위인 카드는 여기서 룰렛이 돌기 시작한다 —
   바로 적용하지 않는다(2026-08-19 David 지시) */
function takeCard(c){
  if (!c.roll){                                // 합류 카드처럼 정할 값이 없는 것은 바로
    G.b.roul = { card:c, mode:'level', vals:null, t:0, applied:false };
    applyRoulette();
    return;
  }
  G.b.roul = startRoulette(c, 'level');
}


/* ============================================================================
   승리 / 패배
   ========================================================================== */
function makeReward(stage){
  const R = CFG.reward, bm = isBoss(stage) ? R.bossMul : 1, out = {};
  for (const k of R.order){
    out[k] = Math.max(1, Math.round((R.base[k] + R.perStage[k] * (stage - 1)) * bm));
  }
  return out;
}

function victory(){
  const r = G.run, b = G.b;
  b.reward = makeReward(r.stage);
  for (const k of CFG.reward.order) G.meta.cur[k] += b.reward[k];
  if (r.stage > G.meta.bestStage) G.meta.bestStage = r.stage;

  b.rewardPhase = 1; b.chest = 0;
  b.pack = makePack(r.stage);        // 상자 다음에 뜨는 카드팩
  makeLoot();
  G.screen = 'reward';
  save();
}

function makeLoot(){
  G.loot = [];
  const cx = L.w / 2, cy = L.h * 0.34;
  for (let i = 0; i < CFG.reward.lootCount; i++){
    const a = rnd(0, TAU), sp = rnd(50, 190);
    G.loot.push({
      x:cx, y:cy, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 70,
      fy:L.h * rnd(0.34, 0.56),        // 한 줄로 모이지 않게 조각마다 멈추는 높이를 다르게
      kind:pickOne(CFG.reward.order), rot:rnd(0, TAU), vr:rnd(-3, 3), sc:rnd(0.85, 1.25),
    });
  }
  // 스킬 카드팩 한 장을 재화 사이에 섞는다(David 지시).
  // 다른 조각보다 크고 가운데 가까이 떨어져서 눈에 먼저 들어온다.
  // 회전은 안 시킨다 — 뱅뱅 돌면 'SKILL' 글자를 못 읽는다(updReward 에서 살랑거리게만 한다)
  G.loot.push({
    x:cx, y:cy, vx:rnd(-45, 45), vy:rnd(-190, -130),
    fy:L.h * rnd(0.40, 0.48),
    kind:'skillpack', rot:0, vr:0, sc:2.1,
  });
}

/* 카드팩 만들기 — 판이 끝날 때 한 번.
   ⚠ 만들어 둔 스킬이 아직 하나뿐이라 3택이 성립하지 않는다.
     빈 자리는 재화 카드로 채운다. CFG.skills.list 의 soon 을 지워 스킬을 채워 넣는 만큼
     재화 카드가 저절로 밀려나므로, 나중에 이 함수를 다시 손볼 필요가 없다.
   ⚠ G.b 는 저장하지 않는다. 그래서 카드는 '고르는 순간' 바로 적용한다(takePackCard) —
     적용을 뒤로 미루면 새로고침 한 번에 뽑은 카드가 사라진다 */
function makePack(stage){
  const n = CFG.skills.packPick, pool = shuffle(packableSkills().slice());
  const cards = [];
  for (let i = 0; i < n; i++){
    const sk = pool[i];
    if (sk){
      cards.push({ kind:'skill', sk:sk });
    } else {
      const F = CFG.skills.filler;
      cards.push({ kind:'cur', k:pickOne(CFG.reward.order), n:F.base + F.perStage * stage });
    }
  }
  return { cards:shuffle(cards), picked:-1, flipT:0 };
}

/* 고른 카드를 그 자리에서 적용한다 */
function takePackCard(i){
  const b = G.b, pk = b.pack;
  if (!pk || pk.picked >= 0) return;
  const c = pk.cards[i];
  if (!c) return;
  pk.picked = i; pk.flipT = 0;
  if (c.kind === 'skill'){
    gainSkill(c.sk.id);                 // 이미 있으면 레벨이 오른다
    c.lvAfter = skillLv(c.sk.id);
  } else {
    G.meta.cur[c.k] += c.n;
    save();
  }
  b.rewardPhase = 5;
}

function updReward(dt){
  const b = G.b;
  for (const p of G.loot){
    p.vy += 420 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    // 카드팩은 글자를 읽어야 하므로 구르지 않고 살짝 흔들리기만 한다
    if (p.kind === 'skillpack') p.rot = Math.sin(G.t * 2.2) * 0.10;
    else p.rot += p.vr * dt;
    if (p.y > p.fy){ p.y = p.fy; p.vy *= -0.32; p.vx *= 0.72; p.vr *= 0.6; }
    p.x = clamp(p.x, 14, L.w - 14);
  }
  if (b.rewardPhase === 2){
    b.chest += dt / CFG.reward.chestFill;
    if (b.chest >= 1){ b.chest = 1; b.rewardPhase = 3; }   // 100%에서 상자가 열린다
  }
  if (b.rewardPhase === 5 && b.pack && b.pack.flipT < CFG.skills.packFlip){
    b.pack.flipT = Math.min(CFG.skills.packFlip, b.pack.flipT + dt);
  }
}

function rewardTap(){
  const b = G.b;
  if (b.rewardPhase === 1){ b.rewardPhase = 2; b.chest = 0; return; }
  // 상자를 열면 카드팩이 나온다. 팩에서는 카드를 눌러야 넘어간다(빈 곳 탭은 무시)
  if (b.rewardPhase === 3){
    if (!b.pack) b.pack = makePack(G.run.stage);
    b.rewardPhase = 4;
    return;
  }
  if (b.rewardPhase === 5 && b.pack.flipT >= CFG.skills.packFlip) nextStage();
}

function nextStage(){
  const r = G.run;
  if (r.stage >= CFG.stage.perWorld){
    // 월드 1 완료. 월드 2는 다음 단계이므로 런을 초기화한다
    G.worldClear = true;
    G.run = newRun();
    save();
    layout();
    G.screen = 'main';
    return;
  }
  // 한 판이 끝나면 홈으로 나온다. 다음 판은 홈의 '전투' 버튼으로 들어간다
  r.stage++; r.wave = 1;
  resetHeroes(r);
  // David 지정: 새 판이 시작되면 성벽 체력도 원복된다.
  // (관찰된 원본은 30판 내내 하나의 체력으로 이어졌지만, 주사위가 판마다 리셋되는
  //  지금 구조에서는 성벽까지 누적되면 판 3~4에서 무조건 막힌다)
  r.wallHp = CFG.wall.hp;
  save();
  G.screen = 'main';
}

function gameOver(){
  const r = G.run;
  G.lastStage = r.stage;
  // 패널티 없음. 판 1 로 되돌리지 않고 그 판에 머문다 — 같은 판을 다시 도전한다.
  // 그 판 안에서 쌓은 면값·굴림 주기·영웅 배치만 초기화되고 성벽은 원복된다.
  // 재화와 무기 레벨은 영구다
  r.wave = 1;
  r.wallHp = CFG.wall.hp;
  resetHeroes(r);
  save();
  layout();
  G.screen = 'gameover';
}


/* ============================================================================
   그리기 — 기본 도구
   ========================================================================== */
let HIT = [];

function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function txt(s, x, y, size, col, align, weight){
  ctx.fillStyle = col || '#fff';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui,-apple-system,"Malgun Gothic",sans-serif';
  ctx.fillText(s, x, y);
}

function txtOut(s, x, y, size, col, align, lw){
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + size + 'px system-ui,-apple-system,"Malgun Gothic",sans-serif';
  ctx.lineJoin = 'round';
  ctx.lineWidth = lw || Math.max(3, size * 0.22);
  ctx.strokeStyle = '#1b1f18';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = col || '#fff';
  ctx.fillText(s, x, y);
}

function bar(x, y, w, h, p, col, bg){
  ctx.fillStyle = bg || '#1b2230';
  rr(x, y, w, h, h / 2); ctx.fill();
  p = clamp(p, 0, 1);
  if (p > 0){
    ctx.save(); rr(x, y, w, h, h / 2); ctx.clip();
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w * p, h);
    ctx.restore();
  }
}

function button(x, y, w, h, label, fn, col, size){
  ctx.fillStyle = col || CFG.col.card;
  rr(x, y, w, h, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  rr(x + 3, y + 3, w - 6, h * 0.42, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
  rr(x, y, w, h, 10); ctx.stroke();
  txt(label, x + w / 2, y + h / 2, size || 16, '#fff', 'center');
  HIT.push({ x:x, y:y, w:w, h:h, fn:fn });
}


/* ---- 무기 아이콘 ---------------------------------------------------------
   물결(빠름) = 청록 초승달 스워시 / 화염(강함) = 주황 불덩이 + 불꽃 꼬리      */
function icoFast(x, y, s){
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 10, s / 10);
  const g = ctx.createLinearGradient(-9, -8, 8, 7);
  g.addColorStop(0, '#f2feff'); g.addColorStop(0.45, CFG.weapons.fast.col); g.addColorStop(1, CFG.weapons.fast.col2);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-9, 3);
  ctx.bezierCurveTo(-9.5, -8, 1, -11.5, 9.5, -6.5);
  ctx.bezierCurveTo(3, -6, -1.5, -0.5, -2.5, 7);
  ctx.bezierCurveTo(-5, 8, -8.5, 6.5, -9, 3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.ellipse(-3.6, -4.4, 3.4, 1.9, -0.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function icoStrong(x, y, s){
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 10, s / 10);
  ctx.fillStyle = CFG.weapons.strong.col2;
  ctx.beginPath();
  ctx.moveTo(0.5, -6.5); ctx.lineTo(11.5, -8.5); ctx.lineTo(3.5, -1.5);
  ctx.lineTo(11.5, 0.5); ctx.lineTo(2.5, 3.5);  ctx.lineTo(8.5, 8);
  ctx.lineTo(-1, 6);
  ctx.closePath(); ctx.fill();
  const g = ctx.createRadialGradient(-4, -3, 0.5, -2, 0, 8.5);
  g.addColorStop(0, '#fff6cf'); g.addColorStop(0.45, CFG.weapons.strong.col); g.addColorStop(1, '#f2691a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(-2, 0, 6.6, 0, TAU); ctx.fill();
  ctx.restore();
}

/* 화살 아이콘. thin=true 면 속사(가는 화살 두 개), false 면 일반 샷(굵은 화살 하나) */
function icoArrowIcon(x, y, s, W, thin){
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 10, s / 10); ctx.rotate(-0.7);
  const draw = (oy, k) => {
    ctx.fillStyle = W.col2;
    ctx.fillRect(-9 * k, oy - 1.1 * k, 15 * k, 2.2 * k);
    ctx.fillStyle = W.col;
    ctx.beginPath();
    ctx.moveTo(10.5 * k, oy); ctx.lineTo(4.5 * k, oy - 4.6 * k); ctx.lineTo(4.5 * k, oy + 4.6 * k);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-9.5 * k, oy); ctx.lineTo(-4 * k, oy - 4.2 * k);
    ctx.lineTo(-2.4 * k, oy); ctx.lineTo(-4 * k, oy + 4.2 * k);
    ctx.closePath(); ctx.fill();
  };
  if (thin){ draw(-3.4, 0.72); draw(3.4, 0.72); }   // 속사 = 두 발
  else     { draw(0, 1.0); }                        // 일반 샷 = 한 발
  ctx.restore();
}

/* 얼음 화살 아이콘 — 화살 + 결정 조각 */
function icoIce(x, y, s){
  icoArrowIcon(x, y, s * 0.95, CFG.weapons.ice, false);
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 10, s / 10);
  ctx.fillStyle = '#eafaff';
  for (const p of [[-6, 5], [4, -6], [7, 4]]){
    ctx.beginPath();
    ctx.moveTo(p[0], p[1] - 2.6); ctx.lineTo(p[0] + 1.8, p[1]);
    ctx.lineTo(p[0], p[1] + 2.6); ctx.lineTo(p[0] - 1.8, p[1]);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function icoWeapon(w, x, y, s){
  if (w === 'fast')        icoFast(x, y, s);
  else if (w === 'strong') icoStrong(x, y, s);
  else if (w === 'swift')  icoArrowIcon(x, y, s, CFG.weapons.swift, true);
  else if (w === 'pierce') icoPierce(x, y, s);
  else if (w === 'bolt')   icoBolt(x, y, s);
  else                     icoIce(x, y, s);
}

/* 관통 — 화살 뒤로 잔상 두 줄. '뚫고 지나간다'를 선으로 보여준다 */
function icoPierce(x, y, s){
  const W = CFG.weapons.pierce;
  ctx.strokeStyle = W.col2; ctx.lineWidth = Math.max(1, s * 0.13); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - s * 1.05, y - s * 0.34); ctx.lineTo(x + s * 0.10, y - s * 0.34);
  ctx.moveTo(x - s * 1.05, y + s * 0.34); ctx.lineTo(x + s * 0.10, y + s * 0.34);
  ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = W.col;
  ctx.beginPath();
  ctx.moveTo(x + s, y); ctx.lineTo(x - s * 0.15, y - s * 0.55);
  ctx.lineTo(x + s * 0.10, y); ctx.lineTo(x - s * 0.15, y + s * 0.55);
  ctx.closePath(); ctx.fill();
}

/* 전기 — 번개 표시 */
function icoBolt(x, y, s){
  const W = CFG.weapons.bolt;
  ctx.fillStyle = W.col2;
  ctx.beginPath(); ctx.arc(x, y, s * 0.92, 0, TAU); ctx.fill();
  ctx.fillStyle = W.col;
  ctx.beginPath();
  ctx.moveTo(x + s * 0.22, y - s * 0.80);
  ctx.lineTo(x - s * 0.40, y + s * 0.10);
  ctx.lineTo(x - s * 0.02, y + s * 0.10);
  ctx.lineTo(x - s * 0.22, y + s * 0.82);
  ctx.lineTo(x + s * 0.44, y - s * 0.14);
  ctx.lineTo(x + s * 0.04, y - s * 0.14);
  ctx.closePath(); ctx.fill();
}


/* ---- 면 타일 ------------------------------------------------------------
   관찰된 원본 타일: 파란 라운드 사각 + 무기 아이콘 + 큰 흰 숫자(발사 수)     */
/* 금속 띠 — 어두운 가장자리 → 본색 → 밝은 반사 띠 → 본색 → 다시 어두움.
   금속이 금속으로 보이는 건 '밝은 띠 하나와 어두운 띠 하나가 같이 있어서'다.
   두 색만 위아래로 깔면 아무리 색을 맞춰도 플라스틱처럼 보인다(2026-08-19 David 지적). */
function metalGrad(x0, y0, x1, y1, pal){
  const c = pal[0], d = pal[1], hi = pal[2] || '#ffffff';
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0.00, d);
  g.addColorStop(0.15, c);
  g.addColorStop(0.31, hi);      // 반사되는 밝은 띠
  g.addColorStop(0.45, c);
  g.addColorStop(0.63, d);       // 그 아래 어두운 띠 — 이 대비가 금속감을 만든다
  g.addColorStop(0.82, c);
  g.addColorStop(1.00, d);
  return g;
}

function faceTile(x, y, w, h, f, opt){
  opt = opt || {};
  const pal = opt.pal || [CFG.col.tile, CFG.col.tile2];
  ctx.fillStyle = metalGrad(x + w * 0.18, y, x + w * 0.82, y + h, pal);
  rr(x, y, w, h, Math.min(10, w * 0.18)); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  rr(x + w * 0.08, y + h * 0.07, w * 0.84, h * 0.3, 6); ctx.fill();
  if (opt.hi){
    ctx.strokeStyle = '#ffe98a'; ctx.lineWidth = 3;
    rr(x, y, w, h, Math.min(10, w * 0.18)); ctx.stroke();
  }
  ctx.save();                                   // 아이콘이 타일 밖으로 새지 않게 자른다
  rr(x, y, w, h, Math.min(10, w * 0.18)); ctx.clip();
  icoWeapon(f.w, x + w * 0.62, y + h * 0.3, Math.min(w, h) * 0.24);
  ctx.restore();
  txtOut(String(f.c), x + w * 0.44, y + h * 0.62, Math.round(h * 0.42), '#fff', 'center');
}


/* ---- 정육면체 주사위 -----------------------------------------------------
   6면을 정육면체의 여섯 방향에 그대로 배정한다.
   n = 바깥 방향, o = 한 코너(단위는 반변), u/v = 면 위의 가로·세로 방향.
   u 가 화면 오른쪽, v 가 화면 아래로 가도록 잡아서 글자가 뒤집히지 않는다.
   모델 좌표는 y 가 위쪽이 +, 화면에 그릴 때 뒤집는다.                      */
const CUBE_FACES = [
  { n:[0, 0, 1], o:[-1,  1,  1], u:[1, 0, 0], v:[0, -1,  0] }, // 면0  +Z
  { n:[0, 0,-1], o:[ 1,  1, -1], u:[-1,0, 0], v:[0, -1,  0] }, // 면1  -Z
  { n:[1, 0, 0], o:[ 1,  1,  1], u:[0, 0,-1], v:[0, -1,  0] }, // 면2  +X
  { n:[-1,0, 0], o:[-1,  1, -1], u:[0, 0, 1], v:[0, -1,  0] }, // 면3  -X
  { n:[0, 1, 0], o:[-1,  1, -1], u:[1, 0, 0], v:[0,  0,  1] }, // 면4  +Y
  { n:[0,-1, 0], o:[-1, -1,  1], u:[1, 0, 0], v:[0,  0, -1] }, // 면5  -Y
];
/* 각 면을 카메라 쪽으로 돌리는 자세 (ax, ay) */
const CUBE_TARGET = [
  [0, 0], [0, Math.PI], [0, -Math.PI / 2], [0, Math.PI / 2],
  [Math.PI / 2, 0], [-Math.PI / 2, 0],
];

/* X축 → Y축 순서로 회전 */
function rot3(p, ax, ay){
  const ca = Math.cos(ax), sa = Math.sin(ax), cb = Math.cos(ay), sb = Math.sin(ay);
  const y1 = p[1] * ca - p[2] * sa;
  const z1 = p[1] * sa + p[2] * ca;
  const x1 = p[0];
  return [ x1 * cb + z1 * sb, y1, -x1 * sb + z1 * cb ];
}

/* 임의 다각형을 모서리 둥글게 — 기울어진 사각형에도 쓸 수 있다 */
function roundPoly(pts, r){
  const n = pts.length;
  ctx.beginPath();
  for (let i = 0; i < n; i++){
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
    const d1 = Math.hypot(p0.x - p1.x, p0.y - p1.y) || 1;
    const d2 = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
    const rr2 = Math.min(r, d1 * 0.45, d2 * 0.45);
    const a = { x:p1.x + (p0.x - p1.x) / d1 * rr2, y:p1.y + (p0.y - p1.y) / d1 * rr2 };
    const b = { x:p1.x + (p2.x - p1.x) / d2 * rr2, y:p1.y + (p2.y - p1.y) / d2 * rr2 };
    if (i === 0) ctx.moveTo(a.x, a.y); else ctx.lineTo(a.x, a.y);
    ctx.quadraticCurveTo(p1.x, p1.y, b.x, b.y);
  }
  ctx.closePath();
}

/* 한 면의 내용 — (0,0)~(side,side) 안에 그린다. 호출부가 기울여 놓는다 */
function cubeFaceContent(side, f, pal, look){
  look = look || CFG.diceTiers[0].look;
  // 살짝 비스듬한 금속 띠 — 정확히 수직이면 띠가 자로 그은 듯해서 어색하다
  ctx.fillStyle = metalGrad(side * 0.18, 0, side * 0.82, side, pal);
  ctx.fillRect(0, 0, side, side);

  // 보석 컷 — 등급이 오를수록 겹이 는다. 숫자·아이콘보다 먼저 깔아야 가려지지 않는다
  if (look.facet >= 1){
    ctx.fillStyle = 'rgba(255,255,255,0.16)';         // 왼쪽 위에서 들어온 빛을 받는 면
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(side, 0); ctx.lineTo(side * 0.5, side * 0.5);
    ctx.closePath(); ctx.fill();
  }
  if (look.facet >= 2){
    ctx.fillStyle = 'rgba(0,20,30,0.16)';             // 반대쪽은 그늘이 져야 깎인 것처럼 보인다
    ctx.beginPath();
    ctx.moveTo(side, side); ctx.lineTo(0, side); ctx.lineTo(side * 0.5, side * 0.5);
    ctx.closePath(); ctx.fill();
  }
  if (look.facet >= 3){
    ctx.fillStyle = 'rgba(255,255,255,0.22)';         // 프리즘 줄 하나
    ctx.beginPath();
    ctx.moveTo(side * 0.06, side * 0.94); ctx.lineTo(side * 0.30, side * 0.94);
    ctx.lineTo(side * 0.94, side * 0.20); ctx.lineTo(side * 0.94, side * 0.02);
    ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,' + look.sheen.toFixed(2) + ')';   // 광택
  ctx.beginPath();
  ctx.ellipse(side * 0.34, side * 0.2, side * 0.3, side * 0.11, -0.25, 0, TAU);
  ctx.fill();
  icoWeapon(f.w, side * 0.7, side * 0.28, side * 0.21);
  txtOut(String(f.c), side * 0.44, side * 0.6, Math.round(side * 0.44), '#fff', 'center',
         Math.max(3, side * 0.09));
}

/* 정육면체 주사위 하나 */
function drawCube(cx, cy, side, faces, ax, ay, pal, look){
  look = look || CFG.diceTiers[0].look;
  // 등급이 높으면 주사위 뒤에서 빛이 번진다. 주사위보다 먼저 깔아야 뒤로 간다
  if (look.glow > 0){
    const gr = ctx.createRadialGradient(cx, cy, side * 0.30, cx, cy, side * 1.15);
    gr.addColorStop(0, 'rgba(' + look.glowRGB + ',' + (look.glow * 0.55).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(' + look.glowRGB + ',0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(cx, cy, side * 1.15, 0, TAU); ctx.fill();
  }
  const h = side / 2, vis = [];
  for (let i = 0; i < CUBE_FACES.length; i++){
    const F = CUBE_FACES[i];
    const n = rot3(F.n, ax, ay);
    if (n[2] <= 0.03) continue;                       // 카메라를 등진 면은 건너뛴다
    const o  = rot3([F.o[0] * h, F.o[1] * h, F.o[2] * h], ax, ay);
    const du = rot3([F.u[0] * side, F.u[1] * side, F.u[2] * side], ax, ay);
    const dv = rot3([F.v[0] * side, F.v[1] * side, F.v[2] * side], ax, ay);
    vis.push({ i:i, n:n, o:o, du:du, dv:dv, z:o[2] + (du[2] + dv[2]) / 2 });
  }
  vis.sort((a, b) => a.z - b.z);                      // 먼 면부터

  for (const V of vis){
    const ox = cx + V.o[0], oy = cy - V.o[1];         // 정사영, 화면 y 뒤집기
    const ux = V.du[0], uy = -V.du[1];
    const vx = V.dv[0], vy = -V.dv[1];
    const quad = [
      { x:ox, y:oy }, { x:ox + ux, y:oy + uy },
      { x:ox + ux + vx, y:oy + uy + vy }, { x:ox + vx, y:oy + vy },
    ];
    ctx.save();
    roundPoly(quad, side * CFG.cube.round);
    ctx.clip();
    ctx.save();
    ctx.transform(ux / side, uy / side, vx / side, vy / side, ox, oy);
    cubeFaceContent(side, faces[V.i], pal, look);
    ctx.restore();
    // 카메라를 덜 향한 면은 어둡게 — 입체감
    const dark = 1 - clamp(V.n[2], 0, 1);
    if (dark > 0.02){
      ctx.fillStyle = 'rgba(6,20,40,' + (dark * 0.62).toFixed(3) + ')';
      roundPoly(quad, side * CFG.cube.round); ctx.fill();
    }
    ctx.restore();
    // 어두운 모서리로 형태를 잡고, 그 위에 등급 색 테두리를 한 겹 올린다
    ctx.strokeStyle = 'rgba(10,40,80,0.35)'; ctx.lineWidth = 1;
    roundPoly(quad, side * CFG.cube.round); ctx.stroke();
    ctx.strokeStyle = look.rim; ctx.lineWidth = look.rimW;
    roundPoly(quad, side * CFG.cube.round); ctx.stroke();
  }

  // 주위를 도는 반짝임 — 플래티넘부터 하나씩 는다
  for (let i = 0; i < look.spark; i++){
    const a  = G.t * (0.8 + i * 0.31) + i * 2.2;
    const d  = side * (0.62 + 0.10 * Math.sin(G.t * 2.1 + i));
    const tw = 0.30 + 0.70 * Math.abs(Math.sin(G.t * 3.1 + i * 1.7));
    ctx.globalAlpha = tw;
    sparkle4(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.78, side * 0.11 * tw, look.rim);
    ctx.globalAlpha = 1;
  }
}


/* ---- 영웅 초상화 ---------------------------------------------------------
   슬롯에 들어가는 얼굴. 원본 이미지를 쓰지 않고 캔버스로 직접 그린다.      */
function heroPortrait(hid, x, y, w, h){
  ctx.save();
  rr(x, y, w, h, 8); ctx.clip();
  const g = ctx.createLinearGradient(x, y, x, y + h);
  if (hid === 'mage')       { g.addColorStop(0, '#3f79c8'); g.addColorStop(1, '#1c3f7a'); }
  else if (hid === 'snake') { g.addColorStop(0, '#4e9c34'); g.addColorStop(1, '#17401a'); }
  else                      { g.addColorStop(0, '#5aa04a'); g.addColorStop(1, '#254d24'); }
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);

  const cx = x + w / 2, by = y + h;
  const s = h / 52;                                   // 52 기준으로 그려서 스케일
  ctx.save(); ctx.translate(cx, by); ctx.scale(s, s);
  if (hid === 'mage'){
    ctx.fillStyle = '#7a5a3a';                        // 지팡이
    ctx.fillRect(11, -34, 3.4, 34);
    ctx.fillStyle = '#2b4f96';                        // 어깨
    ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(15,2); ctx.lineTo(-15,2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8c9a0';                        // 얼굴
    ctx.beginPath(); ctx.ellipse(0,-22, 8.4, 9.4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f2f4f6';                        // 수염
    ctx.beginPath(); ctx.moveTo(-7,-18); ctx.quadraticCurveTo(0,-1, 7,-18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3f79c8';                        // 고깔모자
    ctx.beginPath(); ctx.moveTo(-2,-46); ctx.lineTo(10,-27); ctx.lineTo(-11,-27); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd54a';
    ctx.fillRect(-11.5,-28.6, 22, 3.4);
    ctx.fillStyle = '#1a1f2a';                        // 눈
    ctx.beginPath(); ctx.arc(-3.4,-23, 1.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc( 3.4,-23, 1.5, 0, TAU); ctx.fill();
  } else if (hid === 'snake'){
    // 똬리를 튼 뱀 — 몸통 두 겹, 머리, 갈라진 혀
    ctx.strokeStyle = '#2c6b1c'; ctx.lineWidth = 5.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -9, 12, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.strokeStyle = '#4f9c33'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, -13, 8.5, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = '#79d94f';                        // 머리
    ctx.beginPath(); ctx.ellipse(2, -27, 9.5, 7.6, -0.22, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2c6b1c';                        // 머리 무늬
    ctx.beginPath(); ctx.ellipse(2, -30, 4.6, 2.4, -0.22, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e2483a'; ctx.lineWidth = 1.3; // 갈라진 혀
    ctx.beginPath();
    ctx.moveTo(10, -25); ctx.lineTo(16, -23.5);
    ctx.moveTo(16, -23.5); ctx.lineTo(19, -25.5);
    ctx.moveTo(16, -23.5); ctx.lineTo(19, -21.5);
    ctx.stroke();
    ctx.fillStyle = '#ffd54a';                        // 눈
    ctx.beginPath(); ctx.ellipse(5.4, -28.6, 2.5, 2.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1f2a';
    ctx.beginPath(); ctx.ellipse(5.8, -28.6, 0.9, 2.2, 0, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2.4; // 활
    ctx.beginPath(); ctx.arc(-8,-22, 10.5, -1.2, 1.2); ctx.stroke();
    ctx.strokeStyle = '#e9eef2'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(-4.2,-31.5); ctx.lineTo(-4.2,-12.5); ctx.stroke();
    ctx.fillStyle = '#2f6b2c';                        // 어깨
    ctx.beginPath(); ctx.moveTo(2,-13); ctx.lineTo(16,2); ctx.lineTo(-12,2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8c9a0';                        // 얼굴
    ctx.beginPath(); ctx.ellipse(3,-21, 8.6, 9.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#57913f';                        // 후드
    ctx.beginPath(); ctx.arc(3,-23, 11, Math.PI, TAU); ctx.fill();
    ctx.fillRect(-8,-24.4, 22, 4.2);
    ctx.fillStyle = '#1a1f2a';
    ctx.beginPath(); ctx.arc(0.2,-20, 1.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6.4,-20, 1.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 2;
  rr(x, y, w, h, 8); ctx.stroke();
}


/* ---- 재화 아이콘 --------------------------------------------------------- */
/* 스킬 카드팩 — 전리품에 딱 하나 섞여 떨어지는 보라색 카드 뭉치(David 지시).
   상자 다음에 나오는 카드팩과 같은 색·같은 별이라 '저게 그거구나'가 바로 보인다.
   x,y 는 한가운데다 — 전리품 조각은 자기 자리에서 회전하므로 중심 기준이어야 한다. */
function icoSkillPack(x, y, s){
  const w = s * 1.45, h = s * 1.95, r = s * 0.20;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#241a47';                      // 뒤에 한 장 더 겹쳐 '뭉치'로 보이게
  rr(-w / 2 + s * 0.16, -h / 2 - s * 0.12, w, h, r); ctx.fill();
  ctx.fillStyle = '#3b2a6b';
  rr(-w / 2, -h / 2, w, h, r); ctx.fill();
  ctx.fillStyle = '#543d97';
  rr(-w / 2 + s * 0.12, -h / 2 + s * 0.12, w - s * 0.24, h - s * 0.24, r * 0.8); ctx.fill();
  ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = Math.max(1, s * 0.09);
  rr(-w / 2 + s * 0.12, -h / 2 + s * 0.12, w - s * 0.24, h - s * 0.24, r * 0.8); ctx.stroke();
  star(0, -h * 0.17, s * 0.30);
  txtOut('SKILL', 0, h * 0.26, Math.round(s * 0.44), '#ffe6a8', 'center', Math.max(2, s * 0.13));
  ctx.restore();
}

function icoCur(kind, x, y, s){
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 10, s / 10);
  ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(20,24,18,0.65)'; ctx.lineWidth = 1.4;
  if (kind === 'dagger'){
    ctx.fillStyle = CFG.col.dagger;
    ctx.beginPath();
    ctx.moveTo(9, -8); ctx.lineTo(0, 3); ctx.lineTo(-4, 1); ctx.lineTo(4, -9);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-5.5, 4.5, 3.4, 0, TAU); ctx.stroke();
  } else if (kind === 'crystal'){
    ctx.fillStyle = CFG.col.crystal;
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(5.5, 0); ctx.lineTo(0, 9); ctx.lineTo(-5.5, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(2.4, 0); ctx.lineTo(0, 9); ctx.lineTo(-1.4, 0);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'gold'){
    ctx.fillStyle = CFG.col.gold;
    ctx.beginPath();
    for (let i = 0; i < 6; i++){
      const a = -Math.PI / 2 + i * TAU / 6;
      const px = Math.cos(a) * 8.5, py = Math.sin(a) * 8.5;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7a5406'; ctx.fillRect(-2.6, -2.2, 5.2, 4.4);
  } else if (kind === 'amethyst'){
    ctx.fillStyle = CFG.col.amethyst;
    ctx.beginPath();
    ctx.moveTo(0, -9); ctx.lineTo(6, -4.5); ctx.lineTo(6, 4.5);
    ctx.lineTo(0, 9);  ctx.lineTo(-6, 4.5); ctx.lineTo(-6, -4.5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(3, -4); ctx.lineTo(0, 2); ctx.lineTo(-3, -4);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = '#e9eef2';
    ctx.beginPath(); ctx.arc(0, 2, 7.5, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 2, 7.5, 0, TAU); ctx.clip();
    ctx.fillStyle = CFG.col.potion; ctx.fillRect(-8, -1, 16, 12);
    ctx.restore();
    ctx.fillStyle = '#8e9aa2'; ctx.fillRect(-2.6, -9, 5.2, 4.4); ctx.strokeRect(-2.6, -9, 5.2, 4.4);
  }
  ctx.restore();
}


/* ============================================================================
   그리기 — 전투
   ========================================================================== */
function drawField(){
  ctx.fillStyle = CFG.col.field;
  ctx.fillRect(0, 0, L.w, L.wallY);
  ctx.fillStyle = CFG.col.field2;
  for (let y = 40; y < L.wallY; y += 96) ctx.fillRect(0, y, L.w, 34);
}

/* 성벽 윗면은 완만한 곡선이다. quadraticCurveTo 와 같은 식을 써야 총안이 곡선에 붙는다 */
function wallTopAt(u){ return L.wallY + 10 - 44 * u + 44 * u * u; }

function drawWall(){
  const y = L.wallY;
  // 곡선 아래는 전부 밝은 성벽/바닥
  ctx.fillStyle = CFG.col.wall;
  ctx.beginPath();
  ctx.moveTo(0, y + 10);
  ctx.quadraticCurveTo(L.w / 2, y - 12, L.w, y + 10);
  ctx.lineTo(L.w, L.h); ctx.lineTo(0, L.h);
  ctx.closePath(); ctx.fill();
  // 총안 — 곡선 위로 솟은 같은 색 블록(사이 틈으로 초원이 보여 성벽처럼 읽힌다)
  const n = 9, bw = L.w / n;
  for (let i = 0; i < n; i++){
    const cx = i * bw + bw * 0.5;
    const by = wallTopAt(cx / L.w);
    ctx.fillStyle = CFG.col.wall;
    ctx.fillRect(cx - bw * 0.32, by - 12, bw * 0.64, 14);
    ctx.fillStyle = CFG.col.wall2;
    ctx.fillRect(cx - bw * 0.32, by - 12, bw * 0.64, 3);
  }
  // 성벽 아래 바닥 경계
  ctx.fillStyle = CFG.col.ground;
  ctx.fillRect(0, y + 30, L.w, L.h - y - 30);
  // 성벽 체력 명판
  const r = G.run, pw = 96, px = (L.w - pw) / 2, py = y - 4;
  ctx.fillStyle = CFG.col.wall;
  rr(px, py, pw, 26, 8); ctx.fill();
  ctx.strokeStyle = CFG.col.wall2; ctx.lineWidth = 2;
  rr(px, py, pw, 26, 8); ctx.stroke();
  txtOut(String(r.wallHp), px + pw * 0.42, py + 13, 17, '#6b7280', 'center', 3);
  ctx.fillStyle = '#8b93a0';
  ctx.fillRect(px + pw - 26, py + 6, 13, 14);
  ctx.fillStyle = CFG.col.wall;
  ctx.fillRect(px + pw - 23, py + 9, 3, 4);
  ctx.fillRect(px + pw - 17, py + 9, 3, 4);
}

/* 독 표시 — 몸이 초록으로 물들고 기포가 올라온다. 붉은 피격 섬광과 겹치지 않게 옅게 깐다 */
function drawPoisonMark(e){
  if (!(e.poiT > 0)) return;
  ctx.globalAlpha = 0.34 + 0.16 * Math.sin(G.t * 6 + e.x);
  ctx.fillStyle = '#7ee04a';
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.02, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.75;
  for (let i = 0; i < 3; i++){
    const ph = G.t * 1.6 + i * 2.1 + e.x * 0.05;
    const up = (ph % 1);
    ctx.beginPath();
    ctx.arc(e.x + Math.sin(ph * 3) * e.r * 0.5, e.y - e.r * 0.5 - up * e.r * 1.3,
            1.6 * (1 - up) + 0.6, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawEnemy(e){
  const r = e.r;
  ctx.save();
  ctx.translate(e.x, e.y + Math.sin(e.wob * 2) * r * 0.07);

  ctx.fillStyle = 'rgba(20,26,16,0.22)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.8, r * 0.24, 0, 0, TAU); ctx.fill();

  const kind = e.boss ? 'boss' : (e.kind || 'grunt');

  if (kind === 'mimic'){
    drawMimicBody(r, e);
    ctx.restore();
    if (e.hp < e.hpMax){
      const w = Math.max(30, r * 2.6);
      bar(e.x - w / 2, e.y - r - 14, w, 7, e.hp / e.hpMax, CFG.col.hpFill, CFG.col.hpTrack);
    }
    return;
  }

  const isBig   = kind === 'big' || kind === 'boss';
  const isSmall = kind === 'small';

  // 몸통 — 큰 놈은 진하고 둥글넓적, 작은 놈은 밝고 갸름
  const g = ctx.createLinearGradient(0, -r, 0, r);
  if (isBig)        { g.addColorStop(0, '#7fae4c'); g.addColorStop(1, '#3c5c25'); }
  else if (isSmall) { g.addColorStop(0, '#9ccb62'); g.addColorStop(1, '#5c8038'); }
  else              { g.addColorStop(0, CFG.col.enemy); g.addColorStop(1, CFG.col.enemy2); }
  ctx.fillStyle = g;
  ctx.strokeStyle = CFG.col.enemyLine;
  ctx.lineWidth = Math.max(1.4, r * (isBig ? 0.1 : 0.16));
  ctx.beginPath();
  if (isBig){
    // 아래가 넓은 둥근 덩어리
    ctx.moveTo(0, -r * 1.05);
    ctx.bezierCurveTo(r * 1.15, -r * 0.75, r * 1.1, r * 0.8, 0, r * 0.8);
    ctx.bezierCurveTo(-r * 1.1, r * 0.8, -r * 1.15, -r * 0.75, 0, -r * 1.05);
  } else {
    ctx.moveTo(0, -r * 1.15);
    ctx.bezierCurveTo(r * 0.95, -r * 0.7, r * 0.95, r * 0.85, 0, r * 0.85);
    ctx.bezierCurveTo(-r * 0.95, r * 0.85, -r * 0.95, -r * 0.7, 0, -r * 1.15);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 큰 놈은 표면에 덩어리 자국
  if (isBig){
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.ellipse(-r * 0.34, -r * 0.44, r * 0.3, r * 0.2, -0.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse( r * 0.4,  r * 0.1,  r * 0.24, r * 0.16, 0.3, 0, TAU); ctx.fill();
  }

  // 발
  if (!isSmall){
    ctx.fillStyle = isBig ? '#33501f' : CFG.col.enemy2;
    ctx.beginPath(); ctx.ellipse(-r * 0.36, r * 0.84, r * 0.24, r * 0.13, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse( r * 0.36, r * 0.84, r * 0.24, r * 0.13, 0, 0, TAU); ctx.fill();
  }

  // 눈 — 큰 놈은 몸에 비해 작다
  const eo = isBig ? 0.2 : 0.28, es = isBig ? 0.09 : 0.13;
  ctx.fillStyle = '#15190f';
  ctx.beginPath(); ctx.ellipse(-r * eo, -r * 0.12, r * es, r * es * 1.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r * eo, -r * 0.12, r * es, r * es * 1.5, 0, 0, TAU); ctx.fill();

  if (kind === 'grunt' || kind === 'boss'){
    // 벌린 입 + 빨간 혀 (참고 화면의 중간 놈)
    ctx.fillStyle = '#15190f';
    ctx.beginPath(); ctx.ellipse(0, r * 0.32, r * 0.26, r * 0.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e2564f';
    ctx.beginPath(); ctx.ellipse(0, r * 0.48, r * 0.12, r * 0.22, 0, 0, TAU); ctx.fill();
    // 오른쪽 꼬리
    ctx.fillStyle = CFG.col.enemy2;
    ctx.beginPath(); ctx.ellipse(r * 0.86, r * 0.5, r * 0.24, r * 0.17, -0.5, 0, TAU); ctx.fill();
  } else if (isBig){
    // 큰 놈은 혀 없이 작은 입만 (참고 화면과 동일)
    ctx.fillStyle = '#15190f';
    ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 0.13, r * 0.08, 0, 0, TAU); ctx.fill();
  }

  if (e.slowT > 0){
    // 얼어붙은 표시 — 하늘색 덮개 + 서리 조각
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = CFG.weapons.ice.col;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.95, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#eafaff';
    for (let i = 0; i < 3; i++){
      const a = e.wob * 1.3 + i * TAU / 3;
      ctx.fillRect(Math.cos(a) * r * 0.6 - 1.4, Math.sin(a) * r * 0.6 - 1.4, 2.8, 2.8);
    }
    ctx.globalAlpha = 1;
  }
  if (e.flash > 0){
    ctx.globalAlpha = clamp(e.flash * 3.5, 0, 0.45);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 피해를 입은 적에게만 체력 막대
  if (e.hp < e.hpMax){
    const w = Math.max(30, r * 2.6), h = 7;
    bar(e.x - w / 2, e.y - r - 14, w, h, e.hp / e.hpMax, CFG.col.hpFill, CFG.col.hpTrack);
  }
}

/* 미믹 — 이빨 달린 나무 보물상자. 눈 하나가 뚜껑에 붙어 있다 */
function drawMimicBody(r, e){
  const w = r * 1.75, h = r * 1.45;
  ctx.fillStyle = 'rgba(20,26,16,0.22)';
  ctx.beginPath(); ctx.ellipse(0, h * 0.62, w * 0.5, r * 0.18, 0, 0, TAU); ctx.fill();

  // 몸통
  ctx.strokeStyle = '#3a2412'; ctx.lineWidth = Math.max(1.6, r * 0.12);
  ctx.fillStyle = '#a9743c';
  rr(-w / 2, -h * 0.12, w, h * 0.74, r * 0.16); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(58,36,18,0.55)'; ctx.lineWidth = Math.max(1, r * 0.06);
  ctx.beginPath(); ctx.moveTo(-w * 0.16, -h * 0.1); ctx.lineTo(-w * 0.16, h * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( w * 0.16, -h * 0.1); ctx.lineTo( w * 0.16, h * 0.6); ctx.stroke();

  // 벌린 입 안쪽
  ctx.fillStyle = '#2a1408';
  rr(-w * 0.44, -h * 0.26, w * 0.88, h * 0.3, r * 0.1); ctx.fill();

  // 아래 이빨
  ctx.fillStyle = '#f6f2e6';
  for (let i = 0; i < 4; i++){
    const tx = -w * 0.36 + i * (w * 0.24);
    ctx.beginPath();
    ctx.moveTo(tx, -h * 0.02); ctx.lineTo(tx + w * 0.1, -h * 0.02); ctx.lineTo(tx + w * 0.05, -h * 0.22);
    ctx.closePath(); ctx.fill();
  }

  // 열린 뚜껑
  ctx.save();
  ctx.translate(-w * 0.5, -h * 0.2);                    // 몸통 왼쪽 위 모서리가 경첩
  ctx.rotate(-0.42 + Math.sin(e.wob * 3) * 0.05);
  ctx.strokeStyle = '#3a2412'; ctx.lineWidth = Math.max(1.6, r * 0.12);
  ctx.fillStyle = '#8f5f2e';
  rr(0, -h * 0.44, w, h * 0.5, r * 0.14); ctx.fill(); ctx.stroke();
  // 윗 이빨
  ctx.fillStyle = '#f6f2e6';
  for (let i = 0; i < 4; i++){
    const tx = w * 0.08 + i * (w * 0.24);
    ctx.beginPath();
    ctx.moveTo(tx, h * 0.04); ctx.lineTo(tx + w * 0.1, h * 0.04); ctx.lineTo(tx + w * 0.05, h * 0.24);
    ctx.closePath(); ctx.fill();
  }
  // 눈
  ctx.fillStyle = '#f6f2e6';
  ctx.beginPath(); ctx.arc(w * 0.2, -h * 0.2, r * 0.24, 0, TAU); ctx.fill();
  ctx.fillStyle = '#15190f';
  ctx.beginPath(); ctx.arc(w * 0.22, -h * 0.2, r * 0.11, 0, TAU); ctx.fill();
  ctx.restore();

  if (e.flash > 0){
    ctx.globalAlpha = clamp(e.flash * 3.5, 0, 0.5);
    ctx.fillStyle = '#fff';
    rr(-w / 2, -h * 0.6, w, h * 1.2, r * 0.16); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawBullet(b){
  const M = CFG.missile[b.w], W = CFG.weapons[b.w];
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.a);

  // 꼬리 — fast 는 길고 얇게, strong 은 굵고 짧게
  const g = ctx.createLinearGradient(0, 0, -M.tail, 0);
  g.addColorStop(0, W.col);
  g.addColorStop(0.55, b.w === 'fast' ? 'rgba(127,224,255,0.45)' : 'rgba(232,69,42,0.5)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -M.tailW / 2);
  ctx.lineTo(-M.tail, 0);
  ctx.lineTo(0, M.tailW / 2);
  ctx.closePath(); ctx.fill();

  if (M.shape === 'diamond'){
    ctx.fillStyle = W.col2;
    ctx.beginPath();
    ctx.moveTo(b.r * 1.9, 0); ctx.lineTo(0, -b.r); ctx.lineTo(-b.r * 1.1, 0); ctx.lineTo(0, b.r);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = W.col;
    ctx.beginPath();
    ctx.moveTo(b.r * 1.2, 0); ctx.lineTo(0, -b.r * 0.6); ctx.lineTo(-b.r * 0.6, 0); ctx.lineTo(0, b.r * 0.6);
    ctx.closePath(); ctx.fill();
  } else if (M.shape === 'ice'){
    ctx.fillStyle = W.col2;                       // 대
    ctx.fillRect(-b.r * 1.6, -b.r * 0.2, b.r * 2.6, b.r * 0.4);
    ctx.fillStyle = W.col;                        // 얼음 촉
    ctx.beginPath();
    ctx.moveTo(b.r * 2.1, 0); ctx.lineTo(b.r * 0.5, -b.r * 0.95);
    ctx.lineTo(b.r * 0.9, 0); ctx.lineTo(b.r * 0.5, b.r * 0.95);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eafaff';
    ctx.beginPath(); ctx.arc(b.r * 1.1, 0, b.r * 0.32, 0, TAU); ctx.fill();
  } else if (M.shape === 'arrow'){
    ctx.fillStyle = W.col2;                       // 대
    ctx.fillRect(-b.r * 1.7, -b.r * 0.22, b.r * 2.8, b.r * 0.44);
    ctx.fillStyle = W.col;                        // 촉
    ctx.beginPath();
    ctx.moveTo(b.r * 2.0, 0); ctx.lineTo(b.r * 0.6, -b.r * 0.85); ctx.lineTo(b.r * 0.6, b.r * 0.85);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                              // 깃
    ctx.moveTo(-b.r * 1.8, 0); ctx.lineTo(-b.r * 0.7, -b.r * 0.8);
    ctx.lineTo(-b.r * 0.3, 0);  ctx.lineTo(-b.r * 0.7, b.r * 0.8);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.rotate(Math.PI / 2);            // 불꽃 아이콘은 위쪽이 진행 방향
    const s = b.r * 1.15 * (1 + 0.12 * Math.sin(G.t * 22 + b.ph));
    const rg = ctx.createRadialGradient(0, 0, 0.5, 0, 0, s * 1.6);
    rg.addColorStop(0, '#fff6cf'); rg.addColorStop(0.5, W.col); rg.addColorStop(1, W.col2);
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(0, -s * 1.7);
    ctx.bezierCurveTo(s * 1.15, -s * 0.3, s, s * 1.05, 0, s * 1.1);
    ctx.bezierCurveTo(-s, s * 1.05, -s * 1.15, -s * 0.3, 0, -s * 1.7);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 반짝임 잔상 (물결탄만)
  if (M.spark){
    for (let i = 0; i < b.trail.length; i += 2){
      const k = i / Math.max(2, b.trail.length - 2);
      ctx.globalAlpha = k * 0.7;
      ctx.fillStyle = '#eaffff';
      const sz = 1 + k * 1.6;
      ctx.fillRect(b.trail[i] - sz / 2 + Math.sin(i + G.t * 9) * 3,
                   b.trail[i + 1] - sz / 2 + Math.cos(i * 1.7 + G.t * 9) * 3, sz, sz);
    }
    ctx.globalAlpha = 1;
  }
}

function drawParts(){
  // 폭발 반경 표시
  // 전기 연쇄 — 적과 적 사이를 잇는 지그재그. 가운데를 꺾어 번개처럼 보이게 한다
  for (const g of G.arcs){
    const k = clamp(g.t / g.life, 0, 1);
    ctx.globalAlpha = k;
    ctx.strokeStyle = CFG.weapons.bolt.col; ctx.lineWidth = 3 * k + 1;
    ctx.lineJoin = 'round';
    const dx = g.x2 - g.x1, dy = g.y2 - g.y1;
    const nx = -dy, ny = dx;                     // 수직 방향(꺾을 쪽)
    const len = Math.max(1, Math.hypot(dx, dy));
    ctx.beginPath();
    ctx.moveTo(g.x1, g.y1);
    for (let i = 1; i <= 3; i++){
      const f = i / 4;
      const j = (i % 2 ? 1 : -1) * 9 * k;        // 지그재그 폭. 사라지며 잦아든다
      ctx.lineTo(g.x1 + dx * f + nx / len * j, g.y1 + dy * f + ny / len * j);
    }
    ctx.lineTo(g.x2, g.y2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const g of G.rings){
    const k = 1 - g.t / g.life;
    ctx.globalAlpha = (1 - k) * 0.7;
    ctx.strokeStyle = g.c; ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r * (0.35 + 0.75 * k), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of G.parts){
    ctx.globalAlpha = clamp(p.t / p.life, 0, 1);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHud(){
  const r = G.run, b = G.b;

  // 웨이브 N/M
  const lw = 96, lx = (L.w - lw) / 2, ly = L.waveY;
  ctx.fillStyle = CFG.col.hudLabel; rr(lx, ly, lw, 22, 5); ctx.fill();
  const wlabel = onBossWave()
    ? '보스  ' + r.wave + '/' + waveTotal(r.stage)      // 마지막 웨이브는 보스 차지다
    : '웨이브 ' + r.wave + '/' + waveTotal(r.stage);
  txt(wlabel, L.w / 2, ly + 11, 12, onBossWave() ? '#ffdf6b' : '#fff', 'center');

  // 판 번호 + 웨이브 제한 시간 (구현된 규칙을 눈으로 확인하기 위한 표시)
  txt('판 ' + r.stage + (isBoss(r.stage) ? ' ★' : ''), L.w / 2, ly + 32, 11, '#e8eee2', 'center');
  if (b.phase === 'wave'){
    bar(lx, ly + 40, lw, 3, clamp(b.waveT / CFG.wave.limit, 0, 1), '#f2efe4', 'rgba(0,0,0,0.28)');
  }

  // 다음 웨이브를 지금 부르는 버튼. 웨이브 중·쉬는 중에만 뜬다
  if (b.phase === 'wave' || b.phase === 'gap'){
    const bw2 = 54, bx2 = lx + lw + 6, by2 = ly, bh2 = 22;
    ctx.fillStyle = '#3ac13a'; rr(bx2, by2, bw2, bh2, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; rr(bx2 + 2, by2 + 2, bw2 - 4, 7, 3); ctx.fill();
    // 두 겹 화살표 — '빨리 감기'
    ctx.fillStyle = '#fff';
    for (let k = 0; k < 2; k++){
      const ax2 = bx2 + 9 + k * 8;
      ctx.beginPath();
      ctx.moveTo(ax2, by2 + 7); ctx.lineTo(ax2 + 6, by2 + 11); ctx.lineTo(ax2, by2 + 15);
      ctx.closePath(); ctx.fill();
    }
    txt('출발', bx2 + 36, by2 + 11, 11, '#fff', 'center');
    HIT.push({ x:bx2 - 4, y:by2 - 4, w:bw2 + 8, h:bh2 + 8, fn:function(){ forceNextWave(); } });
  }

  // 좌상단 톱니 = 홈으로 (런은 유지된다)
  const gx = 26, gy = L.waveY + 12;
  ctx.fillStyle = '#f2efe4';
  ctx.beginPath();
  for (let i = 0; i < 8; i++){
    const a = i * TAU / 8;
    ctx.lineTo(Math.cos(a) * 13 + gx, Math.sin(a) * 13 + gy);
    ctx.lineTo(Math.cos(a + 0.28) * 9 + gx, Math.sin(a + 0.28) * 9 + gy);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = CFG.col.field;
  ctx.beginPath(); ctx.arc(gx, gy, 4.6, 0, TAU); ctx.fill();
  HIT.push({ x:gx - 20, y:gy - 20, w:40, h:40, fn:function(){ G.b.menu = 'main'; } });
}

/* 판 포기 — 로비로 나가고 그 판을 처음부터 다시 하게 된다 */
function quitStage(){
  const r = G.run;
  r.wave = 1;
  resetHeroes(r);
  r.wallHp = CFG.wall.hp;    // 판을 처음부터 다시 하므로 성벽도 원복
  save();
  layout();
  G.screen = 'main';
}

function drawDeck(){
  const r = G.run;

  // 슬롯 3칸. 가운데 마법사, 오른쪽 궁수, 나머지는 빈 칸 [관찰]
  for (let i = 0; i < 3; i++){
    if (i === 1) continue;
    if (i === 2 && r.heroes.archer) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    rr(L.slotX[i], L.cardY, L.cardW, L.cardH, 9); ctx.fill();
  }

  for (const hid of liveHeroes()){
    const h = r.heroes[hid], d = G.b.dice[hid];
    const x = L.cardX[hid], y = L.cardY;
    const H = CFG.heroes[hid];

    heroPortrait(hid, x, y, L.cardW, L.cardH);          // 슬롯 안에는 영웅 얼굴

    const air = d.spinT > 0;
    // 굴림 대기 막대 — 다 차면 초록 [관찰]
    const p = 1 - clamp(d.rollT / rollInterval(hid), 0, 1);
    bar(x + 2, L.pillY, L.cardW - 4, L.barH, air ? 1 : p,
        air ? '#5ce03f' : CFG.col.xpFill, '#4a4a42');

    // 이 영웅의 경험치 막대 — 영웅 바로 아래에 둔다
    const need = xpNeed(h.level);
    bar(x + 2, L.xpBarY, L.cardW - 4, L.barH, h.xp / need, H.xp, CFG.col.xpTrack);
    txt('Lv' + h.level + '  ' + h.xp + '/' + need, x + L.cardW / 2, L.lvY, 10,
        '#454b52', 'center');

    // 정육면체 주사위 — 슬롯에서 튀어올라 굴러 착지한다
    const C   = CFG.cube;
    const arc = air ? Math.sin(Math.PI * clamp(1 - d.spinT / d.spinDur, 0, 1)) : 0;
    const ccx = x + L.cardW / 2;
    const ccy = y + L.cardH / 2 - C.jump * arc + C.kickPx * d.kick;   // 발사 반동으로 살짝 눌린다
    ctx.fillStyle = 'rgba(0,0,0,' + (0.24 * (1 - arc * 0.8)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(ccx, y + L.cardH - 1, C.side * 0.42 * (1 - arc * 0.35), C.side * 0.1, 0, 0, TAU);
    ctx.fill();
    drawCube(ccx, ccy, C.side * (1 + C.grow * arc), h.faces, d.ax, d.ay, dicePal(hid), diceLook(hid));
  }
}

function drawBattle(){
  const b = G.b;
  ctx.save();
  drawField();
  for (const e of G.enemies){ drawEnemy(e); drawPoisonMark(e); }
  for (const m of G.bullets) drawBullet(m);
  drawParts();
  drawWall();
  ctx.restore();

  drawDeck();
  drawHud();
  if (b.menu){ drawMenu(); return; }

  if (b.phase === 'bosswarn'){
    const on = (b.warnLeft % 2) === 1 || b.warnT > CFG.boss.warnGap * 0.5;
    if (on){
      ctx.fillStyle = 'rgba(210,40,40,0.30)';
      ctx.fillRect(0, 0, L.w, L.wallY);
      txtOut('보스 접근', L.w / 2, L.wallY * 0.45, 34, '#ffdf6b', 'center', 7);
    }
  }
  if (b.phase === 'boss' && b.boss && !b.boss.dead){
    const w = L.w - 60;
    txt(isBoss(G.run.stage) && G.run.stage === CFG.stage.perWorld ? '최종 보스' : '보스',
        L.w / 2, L.hud + 6, 12, '#ffdf6b', 'center');
    bar(30, L.hud + 16, w, 10, b.boss.hp / b.boss.hpMax, CFG.col.hpFill, CFG.col.hpTrack);
  }
}

   그리기 — 레벨업 3택
